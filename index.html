<title>專案管理概論V3備課大綱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light;
    --surface:     #f9f9f7;
    --card:        #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent-ring: #c23a3a;
    --accent-bg:   #fbeceb;

    /* 8 個分類色 slot——固定順序使用（cat.key = "c1","c2"...），不要重排。
       課程大類數量若超過 8，額外的類別要自己再加 c9、c10... 並補齊 tint／dark。 */
    --c1: #2a78d6; --c1-tint: #eaf1fb;
    --c2: #d1592a; --c2-tint: #fbeee7;
    --c3: #14966a; --c3-tint: #e7f5ef;
    --c4: #b8860a; --c4-tint: #faf3df;
    --c5: #c14a78; --c5-tint: #fbedf2;
    --c6: #2f7a2f; --c6-tint: #edf5ec;
    --c7: #5b4ea3; --c7-tint: #eeecf9;
    --c8: #4d6b80; --c8-tint: #eaf0f3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface:     #0d0d0d;
      --card:        #1a1a19;
      --ink:         #ffffff;
      --ink-2:       #c3c2b7;
      --ink-muted:   #898781;
      --hairline:    #2c2c2a;
      --border:      rgba(255,255,255,0.12);
      --accent-ring: #e66767;
      --accent-bg:   #2a1615;

      --c1: #3987e5; --c1-tint: #14202f;
      --c2: #d95926; --c2-tint: #2a1c10;
      --c3: #199e70; --c3-tint: #0f2620;
      --c4: #c98500; --c4-tint: #2a2110;
      --c5: #d55181; --c5-tint: #2a151e;
      --c6: #3fb53f; --c6-tint: #142616;
      --c7: #9085e9; --c7-tint: #1c1930;
      --c8: #8fa3b8; --c8-tint: #16222a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:     #0d0d0d;
    --card:        #1a1a19;
    --ink:         #ffffff;
    --ink-2:       #c3c2b7;
    --ink-muted:   #898781;
    --hairline:    #2c2c2a;
    --border:      rgba(255,255,255,0.12);
    --accent-ring: #e66767;
    --accent-bg:   #2a1615;

    --c1: #3987e5; --c1-tint: #14202f;
    --c2: #d95926; --c2-tint: #2a1c10;
    --c3: #199e70; --c3-tint: #0f2620;
    --c4: #c98500; --c4-tint: #2a2110;
    --c5: #d55181; --c5-tint: #2a151e;
    --c6: #3fb53f; --c6-tint: #142616;
    --c7: #9085e9; --c7-tint: #1c1930;
    --c8: #8fa3b8; --c8-tint: #16222a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  h1, h2, h3 { font-family: "Noto Serif TC", "Noto Sans TC", serif; }

  a { color: inherit; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in oklab, var(--card) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; }
  .brand .name { font-size: 15px; font-weight: 900; font-family: "Noto Serif TC", serif; }
  .brand .sub { font-size: 11px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  .search-wrap { position: relative; flex: 1 1 180px; min-width: 140px; max-width: 260px; }
  .search-wrap input {
    width: 100%;
    padding: 7px 12px 7px 30px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .search-wrap input:focus { border-color: var(--c1); }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }

  .toolbtn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink-2);
    font-family: inherit; font-size: 12.5px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .toolbtn:hover { border-color: var(--ink-muted); color: var(--ink); }
  .toolbtn.active { background: var(--accent-bg); border-color: var(--accent-ring); color: var(--accent-ring); }

  .jumpnav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .jumpchip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    font-family: inherit;
    font-size: 11.5px; font-weight: 700;
    text-decoration: none;
    color: var(--ink-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .jumpchip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .jumpchip:hover { border-color: var(--ink-muted); color: var(--ink); }
  .jumpchip.active { background: var(--ink); border-color: var(--ink); color: var(--card); }
  .jumpchip.active .dot { outline: 2px solid var(--card); outline-offset: 1px; }

  /* ---------- Page ---------- */
  #page { max-width: 980px; margin: 0 auto; padding: 28px 24px 80px; }

  .hero { margin-bottom: 26px; }
  .hero .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px;
  }
  .hero h1 { font-size: 26px; font-weight: 900; margin: 0 0 8px; line-height: 1.3; text-wrap: balance; }
  .hero p { font-size: 14px; color: var(--ink-2); line-height: 1.8; max-width: 62ch; margin: 0; }

  /* ---------- Weight table ---------- */
  .plan-table {
    margin-top: 22px;
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
  }
  .plan-row {
    display: grid;
    grid-template-columns: 22px 1.4fr 62px 78px 62px 58px 78px;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--hairline);
    font-size: 12.5px;
    text-decoration: none;
    color: var(--ink);
  }
  .plan-row:first-child { border-top: none; background: color-mix(in oklab, var(--ink) 4%, var(--card)); font-weight: 700; color: var(--ink-muted); font-size: 11px; letter-spacing: .03em; }
  .plan-row:not(:first-child):hover { background: color-mix(in oklab, var(--ink) 3%, var(--card)); }
  .plan-row .dot { width: 10px; height: 10px; border-radius: 50%; }
  .plan-row .name { font-weight: 700; }
  .plan-row .num { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-2); }
  .plan-row .hours-cell { font-weight: 700; color: var(--ink); }
  .plan-row:first-child .hours-cell { font-weight: 700; color: var(--ink-muted); }
  .weightbar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--hairline); overflow: hidden; margin: 0 16px 12px; display: flex; }
  .weightbar span { height: 100%; }

  .hours-wrap {
    display: flex; align-items: center; gap: 8px;
    margin: 18px 0 -6px;
    font-size: 12.5px; color: var(--ink-2);
  }
  .hours-wrap input {
    width: 64px;
    padding: 5px 8px;
    border-radius: 7px;
    border: 1px solid var(--hairline);
    background: var(--card);
    color: var(--ink);
    font-family: inherit;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .hours-wrap input:focus { outline: none; border-color: var(--c1); }

  /* ---------- Unit sections ---------- */
  .unit {
    margin-top: 44px;
    scroll-margin-top: 84px;
  }
  .unit-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding-bottom: 14px; margin-bottom: 18px;
    border-bottom: 3px solid var(--u-color);
  }
  .unit-head .idx {
    font-family: "Noto Serif TC", serif;
    font-size: 13px; font-weight: 700; color: var(--u-color);
    border: 1.5px solid var(--u-color); border-radius: 50%;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .unit-head h2 { font-size: 20px; font-weight: 900; margin: 0; flex: 1 1 auto; min-width: 200px; }
  .unit-meta { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .unit-copy {
    border: 1px solid var(--hairline); background: var(--card); color: var(--ink-2);
    border-radius: 7px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .unit-copy:hover { border-color: var(--u-color); color: var(--u-color); }

  .subgrid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .unit.single .subgrid { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .unit.single .subgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .subgrid, .unit.single .subgrid { grid-template-columns: 1fr; } }

  .back-to-overview {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-muted);
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0 0 16px;
  }
  .back-to-overview:hover { color: var(--ink); }
  body.tab-single .back-to-overview, body.tab-diagrams .back-to-overview { display: inline-flex; }
  body.tab-single #plan-table, body.tab-single .hero, body.tab-single .hours-wrap,
  body.tab-diagrams #plan-table, body.tab-diagrams .hero, body.tab-diagrams .hours-wrap { display: none; }

  /* ---------- diagram gallery tab ---------- */
  #diagram-gallery { display: none; }
  body.tab-diagrams #diagram-gallery { display: flex; flex-direction: column; gap: 20px; margin-top: 8px; }
  .diagram-card {
    background: var(--u-tint);
    border: 1px solid color-mix(in oklab, var(--u-color) 30%, var(--hairline));
    border-radius: 12px;
    padding: 16px 18px;
  }
  .diagram-card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .diagram-card-head .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .diagram-card-cat { font-size: 11.5px; color: var(--ink-muted); font-weight: 700; }
  .diagram-card-sep { color: var(--ink-muted); font-size: 11px; }
  .diagram-card-sub { font-size: 14px; font-weight: 900; color: var(--ink); font-family: "Noto Serif TC", serif; }
  .diagram-card-link { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--u-color); text-decoration: none; white-space: nowrap; }
  .diagram-card-link:hover { text-decoration: underline; }
  .diagram-card .diagram { margin: 0; }

  .subcard {
    background: var(--u-tint);
    border: 1px solid color-mix(in oklab, var(--u-color) 30%, var(--hairline));
    border-radius: 12px;
    padding: 14px 16px;
  }
  .subcard h3 {
    font-size: 13.5px; font-weight: 700; margin: 0 0 10px;
    color: var(--ink);
    font-family: "Noto Sans TC", sans-serif;
  }

  /* ---------- diagrams ---------- */
  .subcard.has-diagram { grid-column: 1 / -1; }
  .diagram { margin: 0 0 14px; }
  .diagram figure { margin: 0; }
  .diagram svg { width: 100%; height: auto; display: block; overflow: visible; }
  .diagram figcaption {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed color-mix(in oklab, var(--u-color) 35%, var(--hairline));
    font-size: 12px; color: var(--ink-2); line-height: 1.7; text-align: left;
  }
  .diagram .fbox { fill: var(--card); stroke: var(--u-color); stroke-width: 2; }
  .diagram .fbox.hi { stroke-width: 3; fill: var(--accent-bg); stroke: var(--accent-ring); }
  .diagram .fbox.solid { fill: var(--u-color); fill-opacity: 0.85; stroke: none; }
  .diagram .flabel { font-family: "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .diagram .flabel.on-solid { fill: var(--card); }
  .diagram .fsub { font-family: "Noto Sans TC", sans-serif; font-size: 11px; fill: var(--ink-muted); text-anchor: middle; }
  .diagram .fnote { font-family: "Noto Sans TC", sans-serif; font-size: 11.5px; font-weight: 700; fill: var(--ink-2); text-anchor: middle; }
  .diagram .ftick { font-family: "Noto Sans TC", sans-serif; font-size: 10px; fill: var(--ink-muted); text-anchor: middle; }
  .diagram .fcallout { font-family: "Noto Sans TC", sans-serif; font-size: 12px; font-weight: 700; fill: var(--accent-ring); text-anchor: middle; }
  .diagram .fline { stroke: var(--u-color); stroke-width: 2; fill: none; }
  .diagram .fdash { stroke-dasharray: 5 4; }
  .diagram .faxis { stroke: var(--ink-muted); stroke-width: 1.3; fill: none; }
  .diagram .fbar { stroke: none; }
  .diagram .flegend-dot { }
  .diagram .flegend text { font-family: "Noto Sans TC", sans-serif; font-size: 11px; fill: var(--ink-2); }
  .subcard ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .subcard li { font-size: 12.5px; line-height: 1.6; color: var(--ink-2); }
  .subcard li b { color: var(--ink); font-weight: 700; }
  .subcard li .star { color: var(--accent-ring); margin-right: 2px; }
  .subcard li.hot { background: var(--accent-bg); margin: 0 -8px; padding: 4px 8px; border-radius: 6px; }

  .pt-row { position: relative; }
  .subcard li.expandable { cursor: pointer; }
  .subcard li.expandable:hover .pt-row { background: color-mix(in oklab, var(--u-color) 8%, transparent); }
  .subcard li.expandable:focus-visible { outline: 2px solid var(--u-color); outline-offset: 2px; border-radius: 5px; }
  .subcard li.expandable .pt-row {
    padding: 2px 44px 2px 4px;
    margin: -2px -4px;
    border-radius: 6px;
  }
  .expand-mark {
    position: absolute; right: 0; top: 50%;
    transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 3px;
    color: var(--u-color);
    background: color-mix(in oklab, var(--u-color) 14%, transparent);
    border-radius: 999px;
    padding: 1px 7px 1px 6px;
    font-size: 10px;
    font-weight: 700;
    white-space: nowrap;
  }
  .expand-mark .chev { display: inline-block; transition: transform 0.15s ease; }
  .subcard li.expanded .expand-mark .chev { transform: rotate(180deg); }

  .subcard li .sub-terms {
    list-style: none;
    margin: 8px 0 0;
    padding: 8px 0 2px 12px;
    border-left: 2px solid color-mix(in oklab, var(--u-color) 45%, var(--hairline));
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .subcard li.expanded .sub-terms { display: flex; }
  .subcard .sub-terms li { font-size: 12px; color: var(--ink-2); cursor: default; }
  .subcard .sub-terms li b { color: var(--u-color); font-weight: 700; }

  @media (prefers-reduced-motion: no-preference) {
    .expand-mark { transition: transform 0.15s ease; }
  }

  li.pt-dim { opacity: 0.28; }
  li.pt-match { outline: 2px solid var(--c1); outline-offset: 2px; border-radius: 5px; }

  #no-results { display: none; text-align: center; color: var(--ink-muted); font-size: 13px; padding: 60px 0; }

  footer {
    max-width: 980px; margin: 40px auto 0; padding: 20px 24px 40px;
    border-top: 1px solid var(--hairline);
    font-size: 11.5px; color: var(--ink-muted); line-height: 1.9;
  }

  @media print {
    #topbar { position: static; }
    .jumpnav, .search-wrap, #btn-hot, #btn-copyall, .unit-copy, #btn-expand-terms, .hours-wrap { display: none !important; }
    .expand-mark { display: none !important; }
    .subcard li .sub-terms { display: flex !important; }
    body { background: #fff; color: #000; }
    body.tab-single #plan-table, body.tab-single .hero, body.tab-single .hours-wrap { display: none; }
  }

  @media (max-width: 860px) {
    .legend { margin-left: 0; }
  }
</style>

<div id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="name" id="brand-name">備課大綱</div>
      <div class="sub" id="stat-line">載入中…</div>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="搜尋知識點、專有名詞…" autocomplete="off">
    </div>
    <button class="toolbtn" id="btn-hot">★ 只看易混淆重點</button>
    <button class="toolbtn" id="btn-expand-terms">▾ 展開全部名詞說明</button>
    <button class="toolbtn" id="btn-copyall">複製全部大綱</button>
    <nav class="jumpnav" id="jumpnav"></nav>
  </div>
</div>

<div id="page">
  <button class="back-to-overview" id="btn-back">← 回總覽</button>
  <div class="hero">
    <div class="eyebrow" id="hero-eyebrow">備課參考</div>
    <h1 id="hero-title">把題庫整理成可以直接拿去排課的大綱</h1>
    <p id="hero-desc"></p>
  </div>

  <div class="hours-wrap">
    <label for="hours-input">總授課時數</label>
    <input type="number" id="hours-input" min="0" step="0.5" placeholder="例如 18">
    <span>小時 → 下表自動換算各單元建議時數</span>
  </div>
  <div class="plan-table" id="plan-table"></div>

  <div id="units"></div>
  <div id="diagram-gallery"></div>
  <div id="no-results">沒有符合「<span id="no-results-q"></span>」的知識點</div>

  <footer id="page-footer"></footer>
</div>

<script>
(function () {
  "use strict";

  // =================================================================
  // 1) CONFIG — 每個課程只需要改這裡 + 下面的 DATA，其他都是共用邏輯
  // =================================================================
  var CONFIG = {
    pageTitle: "專案管理概論V3備課大綱",              // <title> 與左上角小字
    courseName: "【TQC】專案管理概論V3",              // 完整課程名稱，會出現在頁首小字
    courseCode: "FF324",           // export_questions.py 的 COURSES[key].value
    heroTitle: null,                                 // null = 自動用「把 N 題題庫，整理成可以直接拿去排課的大綱」
    heroDesc: null,                                  // null = 自動生成，見下方 buildHeroDesc()
    sourceNote: "CSF 雲端練功坊「專案管理概論V3」練習題庫" // 頁尾資料來源說明
  };

  // =================================================================
  // 2) DATA — 課程知識點內容，照這個 schema 填
  // =================================================================
  //
  // DATA = [ category, category, ... ]   // 大類，對應網站「特定領域練習」清單
  //
  // category = {
  //   name:  "大類全名",
  //   short: "大類簡稱（4字內，給分頁按鈕用，避免自動截字切到一半）",
  //   count: 62,          // 這個大類的實際題數（跟 export_questions.py discover 出來的一致）
  //   key:   "c1",        // c1~c8，依序用，不要跳號、不要重複（用來對應 CSS 顏色 slot）
  //   subtopics: [ subtopic, subtopic, ... ]
  // }
  //
  // subtopic = {
  //   name: "子主題名稱",
  //   points: [ point, point, ... ]
  // }
  //
  // point = [ label, desc, hot, terms? ]
  //   label : string   — 知識點標籤，8~15字內，適合當卡片粗體標題
  //   desc  : string   — 一句話完整說明（含考點方向、易混淆提醒）
  //   hot   : 0 | 1     — 1 = 題庫裡明確標示為易混淆／高頻考點，卡片會標★＋紅框
  //   terms : 可省略。當這個知識點其實是「一句話塞好幾個專有名詞」時
  //           （例如「PPC/CPC vs CPM vs CPA/CPS」），把每個名詞拆開列成

        { name: "結案爭議情境處理", points: [

          ["公共工程驗收爭議", "驗收人員與接收人員反對結案，通常反映雙方欠缺溝通，或專案團隊未事先與各方建立專案結案共識。", 0],
          ["結案後內部會議的參與者", "通常以內部人員與客戶代表為主，技術廠商代表這類外部人員較不可能參加內部結案檢討會議。", 0]
        ]}
      ]
    }
  ];

  // =================================================================
  // 3) 以下是共用渲染邏輯，正常不需要修改
  // =================================================================

  document.getElementById("brand-name").textContent = CONFIG.pageTitle;
  document.getElementById("hero-eyebrow").textContent = CONFIG.courseName + "・備課參考";

  var totalQuestions = 0, totalSub = 0, totalLeaf = 0, totalHot = 0;
  DATA.forEach(function (cat) {
    totalQuestions += cat.count;
    cat.subtopics.forEach(function (sub) {
      totalSub++;
      sub.points.forEach(function (p) { totalLeaf++; if (p[2]) totalHot++; });
    });
  });

  document.getElementById("stat-line").textContent = DATA.length + "大類・" + totalSub + "子主題・共" + totalQuestions + "題";
  document.getElementById("hero-title").textContent =
    CONFIG.heroTitle || ("把 " + totalQuestions + " 題題庫，整理成可以直接拿去排課的大綱");
  document.getElementById("hero-desc").textContent =
    CONFIG.heroDesc || ("依 " + DATA.length + " 大類、" + totalSub + " 個子主題整理知識點，附建議授課比重，帶 ★ 的是題庫中特別容易混淆或高頻出現的重點，排課時可以多留一點時間。");
  document.getElementById("page-footer").innerHTML =
    "資料來源：" + escapeHtml(CONFIG.sourceNote) + "（" + escapeHtml(CONFIG.courseCode) + "）題目解析內容整理，共 " + totalQuestions + " 題。知識點文字為AI依題庫內容摘要整理，正式授課前建議對照原始題目複核。";

  // ---------- jump nav (tabs) ----------
  var jumpnav = document.getElementById("jumpnav");

  var overviewChip = document.createElement("button");
  overviewChip.type = "button";
  overviewChip.className = "jumpchip";
  overviewChip.setAttribute("data-tab", "overview");
  overviewChip.textContent = "總覽";
  jumpnav.appendChild(overviewChip);

  var diagramsChip = document.createElement("button");
  diagramsChip.type = "button";
  diagramsChip.className = "jumpchip";
  diagramsChip.setAttribute("data-tab", "diagrams");
  diagramsChip.textContent = "🖼 圖解索引";
  jumpnav.appendChild(diagramsChip);

  DATA.forEach(function (cat, i) {
    var a = document.createElement("button");
    a.type = "button";
    a.className = "jumpchip";
    a.setAttribute("data-tab", String(i));
    a.innerHTML = '<span class="dot" style="background:var(--' + cat.key + ')"></span>' + (i + 1) + ". " + escapeHtml(cat.short || cat.name);
    jumpnav.appendChild(a);
  });

  // ---------- plan table ----------
  var planTable = document.getElementById("plan-table");
  var header = document.createElement("div");
  header.className = "plan-row";
  header.innerHTML = "<span></span><span>單元</span><span class='num'>題數</span><span class='num'>比重</span><span class='num'>子主題</span><span class='num'>重點★</span><span class='num'>建議時數</span>";
  planTable.appendChild(header);

  var hoursCells = [];

  DATA.forEach(function (cat, i) {
    var hotCount = 0, subCount = cat.subtopics.length;
    cat.subtopics.forEach(function (s) { s.points.forEach(function (p) { if (p[2]) hotCount++; }); });
    var fraction = totalQuestions ? cat.count / totalQuestions : 0;
    var pct = Math.round(fraction * 100);

    var row = document.createElement("a");
    row.className = "plan-row";
    row.href = "#unit-" + i;
    row.setAttribute("data-tab", String(i));
    row.innerHTML =
      '<span class="dot" style="background:var(--' + cat.key + ')"></span>' +
      '<span class="name">' + (i + 1) + ". " + escapeHtml(cat.name) + "</span>" +
      '<span class="num">' + cat.count + "題</span>" +
      '<span class="num">約 ' + pct + "%</span>" +
      '<span class="num">' + subCount + "</span>" +
      '<span class="num">' + hotCount + "</span>" +
      '<span class="num hours-cell">—</span>';
    planTable.appendChild(row);
    hoursCells.push({ el: row.querySelector(".hours-cell"), fraction: fraction });

    var bar = document.createElement("div");
    bar.className = "weightbar";
    bar.innerHTML = '<span style="width:' + pct + '%; background:var(--' + cat.key + ')"></span>';
    planTable.appendChild(bar);
  });

  var hoursInput = document.getElementById("hours-input");
  hoursInput.addEventListener("input", function () {
    var total = parseFloat(hoursInput.value);
    var valid = !isNaN(total) && total > 0;
    if (!valid) {
      hoursCells.forEach(function (c) { c.el.textContent = "—"; });
      return;
    }
    // Largest-remainder apportionment in 0.5h slots, so the column always
    // sums exactly to the entered total — rounding each row independently
    // (old approach) can drift the total away from what the teacher typed.
    var totalSlots = Math.max(0, Math.round(total * 2));
    var raw = hoursCells.map(function (c) { return c.fraction * totalSlots; });
    var base = raw.map(Math.floor);
    var used = base.reduce(function (a, b) { return a + b; }, 0);
    var remainder = totalSlots - used;
    var order = raw
      .map(function (v, i) { return { i: i, frac: v - base[i] }; })
      .sort(function (a, b) { return b.frac - a.frac; });
    for (var k = 0; k < remainder && k < order.length; k++) { base[order[k].i]++; }
    hoursCells.forEach(function (c, i) { c.el.textContent = (base[i] * 0.5).toFixed(1) + "h"; });
  });

  // ---------- units ----------
  var unitsEl = document.getElementById("units");
  DATA.forEach(function (cat, ci) {
    var section = document.createElement("section");
    section.className = "unit";
    section.id = "unit-" + ci;
    section.style.setProperty("--u-color", "var(--" + cat.key + ")");
    section.style.setProperty("--u-tint", "var(--" + cat.key + "-tint)");

    var head = document.createElement("div");
    head.className = "unit-head";
    var subCount = cat.subtopics.length;
    head.innerHTML =
      '<span class="idx">' + (ci + 1) + "</span>" +
      "<h2>" + escapeHtml(cat.name) + "</h2>" +
      '<span class="unit-meta">' + cat.count + "題・" + subCount + "個子主題</span>" +
      '<button class="unit-copy" data-ci="' + ci + '">複製本單元大綱</button>';
    section.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "subgrid";
    cat.subtopics.forEach(function (sub) {
      var card = document.createElement("div");
      card.className = "subcard" + (sub.diagram ? " has-diagram" : "");
      var h3 = document.createElement("h3");
      h3.textContent = sub.name;
      card.appendChild(h3);
      if (sub.diagram) {
        var diagramWrap = document.createElement("div");
        diagramWrap.className = "diagram";
        diagramWrap.innerHTML = sub.diagram;
        card.appendChild(diagramWrap);
      }
      var ul = document.createElement("ul");
      sub.points.forEach(function (p) {
        var terms = p[3];
        var li = document.createElement("li");
        li.className = "pt" + (p[2] ? " hot" : "") + (terms ? " expandable" : "");
        var termsText = terms ? terms.map(function (t) { return t[0] + " " + t[1]; }).join(" ") : "";
        li.setAttribute("data-text", (p[0] + " " + p[1] + " " + termsText).toLowerCase());
        li.innerHTML =
          '<div class="pt-row">' +
          (p[2] ? '<span class="star">★</span>' : "") +
          "<b>" + escapeHtml(p[0]) + "</b>　" + escapeHtml(p[1]) +
          (terms ? '<span class="expand-mark" aria-hidden="true">展開<span class="chev">▾</span></span>' : "") +
          "</div>";
        if (terms) {
          var sub2 = document.createElement("ul");
          sub2.className = "sub-terms";
          terms.forEach(function (t) {
            var li2 = document.createElement("li");
            li2.innerHTML = "<b>" + escapeHtml(t[0]) + "</b>　" + escapeHtml(t[1]);
            sub2.appendChild(li2);
          });
          li.appendChild(sub2);
          li.setAttribute("tabindex", "0");
          li.setAttribute("role", "button");
          li.setAttribute("aria-expanded", "false");
          li.addEventListener("click", function () { toggleExpand(li); });
          li.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleExpand(li); }
          });
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    unitsEl.appendChild(section);
  });

  // ---------- diagram gallery ----------
  var galleryEl = document.getElementById("diagram-gallery");
  DATA.forEach(function (cat, ci) {
    cat.subtopics.forEach(function (sub) {
      if (!sub.diagram) return;
      var card = document.createElement("div");
      card.className = "diagram-card";
      card.style.setProperty("--u-color", "var(--" + cat.key + ")");
      card.style.setProperty("--u-tint", "var(--" + cat.key + "-tint)");
      var head = document.createElement("div");
      head.className = "diagram-card-head";
      head.innerHTML =
        '<span class="dot" style="background:var(--' + cat.key + ')"></span>' +
        '<span class="diagram-card-cat">' + escapeHtml(cat.name) + '</span>' +
        '<span class="diagram-card-sep">›</span>' +
        '<span class="diagram-card-sub">' + escapeHtml(sub.name) + '</span>' +
        '<a href="#unit-' + ci + '" class="diagram-card-link" data-tab="' + ci + '">看完整內容 →</a>';
      card.appendChild(head);
      var diagramWrap = document.createElement("div");
      diagramWrap.className = "diagram";
      diagramWrap.innerHTML = sub.diagram;
      card.appendChild(diagramWrap);
      galleryEl.appendChild(card);
    });
  });

  // ---------- tabs ----------
  var currentTab = "overview";

  function setActiveTab(tabId, opts) {
    opts = opts || {};
    currentTab = tabId;
    var isOverview = tabId === "overview";
    var isDiagrams = tabId === "diagrams";

    document.body.classList.toggle("tab-single", !isOverview && !isDiagrams);
    document.body.classList.toggle("tab-diagrams", isDiagrams);

    DATA.forEach(function (cat, i) {
      var el = document.getElementById("unit-" + i);
      var show = !isDiagrams && (isOverview || String(i) === String(tabId));
      el.style.display = show ? "" : "none";
      el.classList.toggle("single", !isOverview && !isDiagrams && show);
    });

    Array.prototype.forEach.call(jumpnav.querySelectorAll(".jumpchip"), function (chip) {
      chip.classList.toggle("active", chip.getAttribute("data-tab") === String(tabId));
    });

    if (!opts.skipHash) {
      history.replaceState(null, "", "#" + (isOverview ? "overview" : isDiagrams ? "diagrams" : "unit-" + tabId));
    }
    applySearchFilter();
    if (!opts.skipScroll) window.scrollTo({ top: 0, behavior: "auto" });
  }

  document.addEventListener("click", function (e) {
    var tabEl = e.target.closest("[data-tab]");
    if (tabEl) {
      e.preventDefault();
      setActiveTab(tabEl.getAttribute("data-tab"));
    }
  });

  document.getElementById("btn-back").addEventListener("click", function () {
    setActiveTab("overview");
  });

  function initTabFromHash() {
    var h = location.hash.replace("#", "");
    var m = h.match(/^unit-(\d+)$/);
    if (m && DATA[parseInt(m[1], 10)]) {
      setActiveTab(m[1], { skipHash: true, skipScroll: true });
    } else if (h === "diagrams") {
      setActiveTab("diagrams", { skipHash: true, skipScroll: true });
    } else {
      setActiveTab("overview", { skipHash: true, skipScroll: true });
    }
  }

  function toggleExpand(li) {
    var isOpen = li.classList.toggle("expanded");
    li.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- copy outline ----------
  function outlineText(ci) {
    var cat = DATA[ci];
    var lines = [cat.name + "（" + cat.count + "題）", ""];
    cat.subtopics.forEach(function (sub) {
      lines.push("■ " + sub.name);
      sub.points.forEach(function (p) {
        lines.push("　" + (p[2] ? "★ " : "・") + p[0] + "：" + p[1]);
        if (p[3]) {
          p[3].forEach(function (t) { lines.push("　　- " + t[0] + "：" + t[1]); });
        }
      });
      lines.push("");
    });
    return lines.join("\n");
  }
  function copyText(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已複製 ✓";
      setTimeout(function () { btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".unit-copy");
    if (btn) copyText(outlineText(parseInt(btn.getAttribute("data-ci"), 10)), btn);
  });

  document.getElementById("btn-copyall").addEventListener("click", function (e) {
    var all = DATA.map(function (_, i) { return outlineText(i); }).join("\n");
    copyText(CONFIG.courseName + "　備課大綱\n\n" + all, e.currentTarget);
  });

  // ---------- expand/collapse all term breakdowns ----------
  var termsExpanded = false;
  document.getElementById("btn-expand-terms").addEventListener("click", function (e) {
    termsExpanded = !termsExpanded;
    e.currentTarget.textContent = termsExpanded ? "▴ 收合全部名詞說明" : "▾ 展開全部名詞說明";
    Array.prototype.forEach.call(document.querySelectorAll(".subcard li.expandable"), function (li) {
      li.classList.toggle("expanded", termsExpanded);
      li.classList.remove("auto-expanded");
      li.setAttribute("aria-expanded", termsExpanded ? "true" : "false");
    });
  });

  // ---------- hot filter ----------
  var hotOn = false;
  document.getElementById("btn-hot").addEventListener("click", function (e) {
    hotOn = !hotOn;
    e.currentTarget.classList.toggle("active", hotOn);
    Array.prototype.forEach.call(document.querySelectorAll(".subcard li"), function (li) {
      li.classList.toggle("pt-dim", hotOn && !li.classList.contains("hot"));
    });
  });

  // ---------- search ----------
  var searchInput = document.getElementById("search");

  function applySearchFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var anyMatch = false;
    var isOverview = currentTab === "overview";

    DATA.forEach(function (cat, i) {
      var unit = document.getElementById("unit-" + i);
      var tabEligible = isOverview || String(i) === String(currentTab);
      if (!tabEligible) return;

      var unitHasMatch = false;
      Array.prototype.forEach.call(unit.querySelectorAll(".subcard"), function (card) {
        var cardHasMatch = false;
        // .pt only — a plain "li" selector would also match the nested
        // <li> inside .sub-terms, which have no data-text and crash .indexOf.
        Array.prototype.forEach.call(card.querySelectorAll("li.pt"), function (li) {
          var isMatch = q && li.getAttribute("data-text").indexOf(q) !== -1;
          li.classList.toggle("pt-match", !!isMatch);
          li.classList.toggle("pt-dim", !!q && !isMatch);
          if (isMatch) {
            cardHasMatch = true;
            anyMatch = true;
            if (li.classList.contains("expandable") && !li.classList.contains("expanded")) {
              li.classList.add("expanded", "auto-expanded");
              li.setAttribute("aria-expanded", "true");
            }
          } else if (li.classList.contains("auto-expanded")) {
            li.classList.remove("expanded", "auto-expanded");
            li.setAttribute("aria-expanded", "false");
          }
        });
        card.style.display = (!q || cardHasMatch) ? "" : "none";
        if (cardHasMatch) unitHasMatch = true;
      });

      if (isOverview) unit.style.display = (!q || unitHasMatch) ? "" : "none";
    });

    document.getElementById("no-results").style.display = (q && !anyMatch) ? "block" : "none";
    document.getElementById("no-results-q").textContent = q;
  }

  searchInput.addEventListener("input", applySearchFilter);

  initTabFromHash();
})();
</script>
