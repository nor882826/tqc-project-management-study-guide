<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專案管理概論V3 複習講義</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --surface:     #f9f9f7;
    --card:        #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --hairline:    #e1e0d9;
    --border:      rgba(11,11,11,0.10);
    --accent-ring: #c23a3a;
    --accent-bg:   #fbeceb;

    --c1: #2a78d6; --c1-tint: #eaf1fb; --c1-strong: #2976d2;
    --c2: #d1592a; --c2-tint: #fbeee7; --c2-strong: #c45427;
    --c3: #14966a; --c3-tint: #e7f5ef; --c3-strong: #12875f;
    --c4: #b8860a; --c4-tint: #faf3df; --c4-strong: #976e08;
    --c5: #c14a78; --c5-tint: #fbedf2; --c5-strong: #c14a78;
    --c6: #2f7a2f; --c6-tint: #edf5ec; --c6-strong: #2f7a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #0d0d0d; --card: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
      --hairline: #2c2c2a; --border: rgba(255,255,255,0.12);
      --accent-ring: #e66767; --accent-bg: #2a1615;
      --c1: #3987e5; --c1-tint: #14202f; --c1-strong: #3987e5;
      --c2: #d95926; --c2-tint: #2a1c10; --c2-strong: #d95926;
      --c3: #199e70; --c3-tint: #0f2620; --c3-strong: #199e70;
      --c4: #c98500; --c4-tint: #2a2110; --c4-strong: #c98500;
      --c5: #d55181; --c5-tint: #2a151e; --c5-strong: #d55181;
      --c6: #3fb53f; --c6-tint: #142616; --c6-strong: #3fb53f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  a { color: inherit; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in oklab, var(--card) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
  }
  .topbar-inner {
    max-width: 1100px; margin: 0 auto; padding: 12px 15px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .brand { font-size: 15px; font-weight: 900; }
  .brand .sub { font-size: 12.5px; color: var(--ink-muted); font-weight: 400; }
  .back-link {
    font-size: 14px; font-weight: 700; color: var(--ink-2); text-decoration: none;
    border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 12px; white-space: nowrap;
  }
  .back-link:hover { border-color: var(--ink-muted); color: var(--ink); }

  .hot-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 700; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    white-space: nowrap; user-select: none;
  }
  .hot-toggle input { accent-color: var(--accent-ring); }
  .hot-toggle.active { background: var(--accent-bg); border-color: var(--accent-ring); color: var(--accent-ring); }

  .search-wrap { flex: 1 1 160px; min-width: 140px; max-width: 240px; margin-left: auto; position: relative; }
  .search-wrap input {
    width: 100%; padding: 7px 12px 7px 30px; border-radius: 8px; border: 1px solid var(--hairline);
    background: var(--surface); color: var(--ink); font-family: inherit; font-size: 15px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--c1); }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }
  #search-count { font-size: 13px; color: var(--ink-muted); margin-left: 4px; white-space: nowrap; }

  /* ---------- Hero ---------- */
  #hero { max-width: 1100px; margin: 0 auto; padding: 26px 15px 6px; }
  #hero .eyebrow { font-size: 13.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
  #hero h1 { font-size: 28px; font-weight: 900; margin: 0 0 10px; line-height: 1.4; }
  #hero p { font-size: 16.5px; color: var(--ink-2); line-height: 1.85; margin: 0 0 16px; max-width: 780px; }
  #hero .hero-diagram {
    margin: 0 0 8px; padding: 20px 22px; background: var(--c1-tint);
    border: 1px solid color-mix(in oklab, var(--c1) 30%, var(--hairline)); border-radius: 14px;
  }
  #hero .hero-diagram figure { margin: 0; }
  #hero .hero-diagram svg { width: 100%; max-width: 900px; height: auto; display: block; margin: 0 auto; overflow: visible; }
  #hero .hero-diagram figcaption {
    margin-top: 10px; padding-top: 10px; max-width: 900px; margin-left: auto; margin-right: auto;
    border-top: 1px dashed color-mix(in oklab, var(--c1) 35%, var(--hairline));
    font-size: 15px; color: var(--ink-2); line-height: 1.8; text-align: left;
  }
  #hero .hero-diagram .fnote { font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; fill: var(--ink-2); text-anchor: middle; }
  #hero .hero-diagram .flabel { font-family: "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  #hero .hero-diagram .flabel.on-solid { fill: #fff; }
  #hero .hero-diagram .faxis { stroke: var(--ink-muted); stroke-width: 1.3; fill: none; }
  #hero .map-caption { font-size: 13.5px; color: var(--ink-muted); margin: 6px 0 14px; text-align: center; }
  #hero .hero-story { margin: 0 0 22px; }
  #hero .hero-story .map-fig {
    margin: 8px 0 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--hairline);
    max-height: 420px; display: flex; justify-content: center; background: var(--card);
  }
  #hero .hero-story .map-fig img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: cover; object-position: top; }

  /* ---------- Quick entry (floating collapsible nav) ---------- */
  .cat-nav {
    position: fixed; left: 15px; top: 50%; transform: translateY(-50%);
    z-index: 15; display: flex; align-items: center; gap: 0;
  }
  .cat-nav-toggle {
    flex: none; width: 34px; height: 56px; border-radius: 0 12px 12px 0;
    border: 1px solid var(--hairline); border-left: none;
    background: var(--card); color: var(--ink-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 2px 2px 10px rgba(0,0,0,0.08);
  }
  .cat-nav-toggle:hover { color: var(--ink); }
  .cat-nav-panel {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 10px; margin-left: -1px; width: 220px;
    box-shadow: 2px 4px 16px rgba(0,0,0,0.1);
    max-height: 80vh; overflow-y: auto;
  }
  .cat-nav.collapsed .cat-nav-panel { display: none; }
  .cat-nav.collapsed .cat-nav-toggle { border-radius: 12px; border-left: 1px solid var(--hairline); }
  .entry-btn {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 12px; border-radius: 10px; border: 1px solid var(--hairline);
    border-left: 4px solid var(--entry-text);
    background: var(--card); color: var(--entry-text);
    font-family: inherit; font-size: 13.5px; font-weight: 700; text-decoration: none;
    cursor: pointer; text-align: left; line-height: 1.4;
  }
  .entry-btn .num { font-size: 15px; font-weight: 900; flex: none; }
  .entry-btn:hover { background: var(--entry-tint); }

  /* ---------- Page ---------- */
  #page { max-width: 1100px; margin: 0 auto; padding: 0 15px 80px; }

  details.cat-block {
    border: 1px solid var(--hairline); border-radius: 14px; margin-bottom: 12px;
    background: var(--card); scroll-margin-top: 90px;
  }
  details.cat-block[open] { border-color: color-mix(in oklab, var(--u-color) 40%, var(--hairline)); }
  .cat-summary {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 14px 16px; list-style: none; border-radius: 13px;
    background: color-mix(in oklab, var(--u-color) 10%, var(--card));
  }
  details.cat-block[open] .cat-summary { border-radius: 13px 13px 0 0; }
  .cat-summary::-webkit-details-marker { display: none; }
  .cat-summary .num-badge {
    width: 28px; height: 28px; border-radius: 50%; flex: none;
    background: var(--u-text); color: #fff; font-size: 13.5px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .cat-summary h2 { font-size: 20px; font-weight: 900; margin: 0; flex: 1 1 auto; color: var(--ink); }
  .cat-summary .cat-count { font-size: 13.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cat-summary .chev { color: var(--u-text); transition: transform .15s; flex: none; }
  details.cat-block[open] .cat-summary .chev { transform: rotate(90deg); }

  .cat-body { padding: 18px 16px 6px; }

  .sub-block { margin-bottom: 20px; }
  .sub-title {
    font-size: 17px; font-weight: 900; margin: 0 0 8px; color: var(--ink);
  }

  .diagram-wrap { margin: 0 0 14px; }
  .diagram-lead {
    font-size: 13.5px; font-weight: 700; color: var(--u-text); margin-bottom: 6px;
    display: flex; align-items: center; gap: 5px;
  }
  .diagram {
    background: var(--u-tint); border: 1px solid color-mix(in oklab, var(--u-color) 30%, var(--hairline));
    border-radius: 12px; padding: 14px 16px;
  }
  .diagram figure { margin: 0; }
  .diagram svg { width: 100%; height: auto; display: block; overflow: visible; }
  .diagram figcaption {
    margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed color-mix(in oklab, var(--u-color) 35%, var(--hairline));
    font-size: 15px; color: var(--ink-2); line-height: 1.8; text-align: left;
  }
  .diagram .fbox:not([fill^="var(--c"]) { fill: var(--card); stroke: var(--u-color); stroke-width: 2; }
  .diagram .fbox.hi { stroke-width: 3; fill: var(--accent-bg); stroke: var(--accent-ring); }
  .diagram .fbox.solid:not([fill^="var(--c"]) { fill: var(--u-color); fill-opacity: 0.85; stroke: none; }
  .diagram .fbox.solid[fill^="var(--c"] { fill-opacity: 0.85; stroke: none; }
  .diagram .flabel:not([fill^="var(--c"]):not([fill="var(--accent-ring)"]) { font-family: "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .diagram .flabel { font-family: "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; }
  .diagram .flabel.on-solid { fill: var(--card); }
  .diagram .fsub { font-family: "Noto Sans TC", sans-serif; font-size: 13px; fill: var(--ink-muted); text-anchor: middle; }
  .diagram .fnote { font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; fill: var(--ink-2); text-anchor: middle; }
  .diagram .ftick { font-family: "Noto Sans TC", sans-serif; font-size: 12px; fill: var(--ink-muted); text-anchor: middle; }
  .diagram .fcallout { font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; fill: var(--accent-ring); text-anchor: middle; }
  .diagram .fline:not([stroke^="var(--c"]) { stroke: var(--u-color); stroke-width: 2; fill: none; }
  .diagram .fdash { stroke-dasharray: 5 4; }
  .diagram .faxis { stroke: var(--ink-muted); stroke-width: 1.3; fill: none; }
  .diagram .fbar { stroke: none; }
  .diagram .flegend text { font-family: "Noto Sans TC", sans-serif; font-size: 13px; fill: var(--ink-2); }

  .points { display: flex; flex-direction: column; }
  .point-card {
    padding: 12px 4px; border-bottom: 1px solid var(--hairline);
  }
  .points .point-card:last-child { border-bottom: none; }
  .point-card.hot { border-left: 3px solid var(--accent-ring); padding-left: 10px; }
  .point-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .point-label { font-size: 17px; font-weight: 900; line-height: 1.5; color: var(--ink); }
  .hot-badge {
    flex: none; font-size: 12.5px; font-weight: 700; color: var(--accent-ring);
    background: var(--accent-bg); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .point-desc {
    font-size: 16.5px; line-height: 1.9; color: var(--ink); margin: 0 0 8px;
  }

  details.story-aux { margin-top: 8px; }
  details.story-aux summary {
    cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink-muted);
    list-style: none; display: inline-flex; align-items: center; gap: 5px;
  }
  details.story-aux summary:hover { color: var(--u-text); }
  details.story-aux summary::-webkit-details-marker { display: none; }
  details.story-aux summary::before { content: "▸"; display: inline-block; transition: transform .15s; }
  details.story-aux[open] summary::before { transform: rotate(90deg); }
  details.story-aux .formal-body {
    font-size: 15px; color: var(--ink-2); line-height: 1.85; padding: 8px 10px; margin-top: 4px;
    background: var(--u-tint); border-radius: 8px;
  }
  .terms { margin: 6px 0 8px; padding-left: 14px; border-left: 2px solid var(--hairline); display: flex; flex-direction: column; gap: 8px; }
  .term b { font-size: 14.5px; color: var(--ink); }
  .term span { display: block; font-size: 14px; color: var(--ink-2); margin-top: 2px; line-height: 1.75; }

  .confusable-box {
    margin: 6px 0 8px; border: 1px solid #e8c874; background: #fdf6e3; border-radius: 8px; padding: 10px 12px;
  }
  .confusable-title { font-size: 14px; font-weight: 900; color: #8a6a10; margin-bottom: 4px; }
  .confusable-body { font-size: 15px; color: #5c4a12; line-height: 1.85; }
  .confusable-body b { color: #7a5c0e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .confusable-box { background: #2b2308; border-color: #6b5518; }
    :root:not([data-theme="light"]) .confusable-title { color: #e0c877; }
    :root:not([data-theme="light"]) .confusable-body { color: #d9c896; }
    :root:not([data-theme="light"]) .confusable-body b { color: #f0dca0; }
  }

  #no-results { display: none; text-align: center; color: var(--ink-muted); font-size: 15px; padding: 60px 0; }
  body.hot-only .point-card:not(.hot) { display: none; }
  .sub-block.is-hidden, details.cat-block.is-hidden { display: none; }

  .practice-cta {
    max-width: 1100px; margin: 10px auto 0; padding: 20px 15px; border: 1px dashed var(--hairline);
    border-radius: 14px; text-align: center; background: var(--card);
  }
  .practice-cta a {
    display: inline-block; margin-top: 8px; font-weight: 700; color: var(--c1);
    text-decoration: none; border-bottom: 2px solid var(--c1);
  }

  footer {
    max-width: 1100px; margin: 30px auto 0; padding: 16px 15px 40px;
    border-top: 1px solid var(--hairline); font-size: 13.5px; color: var(--ink-muted); line-height: 1.9;
  }

  @media (max-width: 640px) {
    #hero h1 { font-size: 23px; }
    #hero .hero-story .map-fig, #hero .hero-story .map-fig img { max-height: 220px; }
    #hero .hero-diagram { padding: 12px; }
    .cat-nav { top: auto; bottom: 15px; transform: none; left: 0; }
    .cat-nav-panel { max-width: 46vw; }
    .entry-btn { font-size: 12.5px; padding: 7px 9px; }
    .search-wrap { max-width: none; flex-basis: 100%; order: 5; margin-left: 0; }
    .cat-summary h2 { font-size: 17px; }
    .point-label { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div>專案管理概論V3・複習講義</div>
      <div class="sub">照題庫分類順序，複習 125 個知識點</div>
    </div>
    <a class="back-link" href="index.html">給老師的備課大綱 →</a>
    <label class="hot-toggle" id="hot-toggle">
      <input type="checkbox" id="hot-checkbox"> ★ 只看常考混淆點
    </label>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="搜尋知識點…">
    </div>
  </div>
</div>

<div id="hero">
  <div class="eyebrow">複習講義・專案管理概論 V3</div>
  <h1>照題庫分類、子主題、知識點的順序複習</h1>
  <p>
    每個知識點先看題庫原本的定義／考點說明，容易搞混的重點另外用⚠️框起來對照。
    標示 ★ 的是題庫裡特別容易考混、常出現的重點，上面也可以直接切到
    「只看常考混淆點」模式。
  </p>
  <div id="hero-diagram" class="hero-diagram"></div>
  <div class="map-caption">五個流程群組在時間上是重疊的，不是切成五段各自獨立——點左邊的分類選單直接跳過去複習</div>
  <details class="story-aux hero-story">
    <summary>💡 生活比喻總覽（辦一場畢業成果發表會）</summary>
    <figure class="map-fig">
      <img src="draft_overall_map_v2.png" alt="專案管理概論V3整體地圖：辦一場畢業成果發表會的五個階段">
    </figure>
  </details>
</div>

<div class="cat-nav" id="cat-nav">
  <div class="cat-nav-panel" id="entry-row"></div>
  <button class="cat-nav-toggle" id="cat-nav-toggle" title="分類選單" aria-label="切換分類選單">☰</button>
</div>

<div id="page">
  <div id="sections"></div>
  <div id="no-results">沒有找到符合的知識點，換個關鍵字或關掉「只看常考」試試？</div>

  <div class="practice-cta">
    想練習看看考題怎麼出、選項為什麼對或錯？
    <br>
    <a href="選項解析.html">去看選項解析（PM角度）→</a>
  </div>
</div>

<script>
var DATA = [{"name":"專案管理基本概念","short":"基本概念","count":60,"key":"c1","subtopics":[{"name":"專案基本定義與特性","points":[["專案四大特性","暫時性、獨特性、逐步完善、資源與成本限制，是判斷「這是不是專案」的核心依據。",1,[["暫時性 Temporary","有明確的開始與結束日期，不會無限期進行；結束不代表短期，只代表有終點。"],["獨特性 Unique","每個專案的產出（產品/服務/結果）都獨一無二，即使類似的專案本質仍不同。"],["逐步完善 Progressive Elaboration","專案的特性和細節隨時間推進、資訊漸增而逐步發展、持續精確化。"],["資源與成本限制","任何專案都受限於預算與可用資源，不可能無限投入。"]],"想像你們班要辦畢業成果發表會：有明確的表演日（有開始有結束）、每一屆辦的都不一樣（獨一無二）、一開始只有大概構想、細節邊籌備邊補齊、班費和人手就這麼多，不能無限加碼。"],["專案 vs 日常工作","專案是暫時性、獨特性；日常工作（Operation）是持續性、重複性的程序性工作，這組對比常被拿來出「差異在哪」的題。",1,null,"辦畢業成果發表會像「限時任務」，辦完就解散；每天上課、每週交作業則是「無限循環」，天天重複、沒有終點。"],["專案的四大限制條件","範疇、時間、成本、品質彼此牽動，規劃時要平衡取捨，這四項也是常見的專案限制條件考點。",0,null,"辦活動要顧四件事：要做多少內容（範疇）、剩多少天（時間）、班費夠不夠（成本）、表演好不好看（品質）——想多加一段表演，時間或班費就得跟著多，四個是連動的。"],["專案成功的必要條件","如期完成、滿足顧客需求是必要條件；「使用最少資源」「改變企業文化」不是判斷成功與否的必要依據。",1,null,"發表會辦得成不成功，最基本是看：有沒有準時在那天演出、有沒有讓校方和觀眾滿意，不是看你們用了多少道具、或改了幾次班規。"],["專案的產出可以是什麼","產品、服務或結果都算專案產出，不限於實體產品，也可以是報告或里程碑。",0,null,"辦活動的成果不一定是「一場秀」，也可以是一份成果冊、一次志工服務，或只是完成其中一個階段，例如順利彩排完一次。"],["專案的正式定義","「為創建一獨特的產品、服務或結果所做的一次性努力」是專案最正式的定義句型，常整句考選擇題。",0,null,"課本對「專案」最正式的講法：為了做出一個獨一無二的成果，大家一次性投入的努力——就像這場「只辦一次」的畢業成果發表會。"]]},{"name":"五大流程群組","diagram":"<figure><svg viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"五大流程群組甘特圖，顯示各流程群組在時間軸上的重疊關係\"><defs><marker id=\"pg-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"currentColor\"/></marker></defs><text x=\"320\" y=\"16\" class=\"fnote\">五大流程群組在「時間」上是重疊的，不是切成五段各自獨立</text><g stroke=\"var(--hairline)\" stroke-width=\"1\"><line x1=\"140\" y1=\"30\" x2=\"140\" y2=\"216\"/><line x1=\"240\" y1=\"30\" x2=\"240\" y2=\"216\"/><line x1=\"340\" y1=\"30\" x2=\"340\" y2=\"216\"/><line x1=\"440\" y1=\"30\" x2=\"440\" y2=\"216\"/><line x1=\"540\" y1=\"30\" x2=\"540\" y2=\"216\"/></g><rect x=\"60\" y=\"34\" width=\"150\" height=\"26\" rx=\"5\" class=\"fbox solid\" fill=\"var(--c1)\"/><text x=\"135\" y=\"52\" class=\"flabel on-solid\">① 起始</text><rect x=\"150\" y=\"70\" width=\"300\" height=\"26\" rx=\"5\" class=\"fbox solid\" fill=\"var(--c2)\"/><text x=\"300\" y=\"88\" class=\"flabel on-solid\">② 規劃</text><rect x=\"330\" y=\"106\" width=\"260\" height=\"26\" rx=\"5\" class=\"fbox solid\" fill=\"var(--c3)\"/><text x=\"460\" y=\"124\" class=\"flabel on-solid\">③ 執行</text><rect x=\"140\" y=\"142\" width=\"450\" height=\"26\" rx=\"5\" class=\"fbox solid\" fill=\"var(--c4)\"/><text x=\"365\" y=\"160\" class=\"flabel on-solid\">④ 監視及控制（貫穿全程）</text><rect x=\"560\" y=\"178\" width=\"70\" height=\"26\" rx=\"5\" class=\"fbox solid\" fill=\"var(--c5)\"/><text x=\"595\" y=\"196\" class=\"flabel on-solid\">⑤ 結束</text><line x1=\"55\" y1=\"228\" x2=\"630\" y2=\"228\" class=\"faxis\" marker-end=\"url(#pg-arrow)\"/><text x=\"342\" y=\"245\" class=\"ftick\">專案時間 →</text></svg><figcaption>這是一張甘特圖：橫條的左右範圍代表這個流程群組實際發生的時間區間，不是先後排隊的順序。規劃、執行、監視及控制三者大幅重疊——尤其監視及控制幾乎貫穿整個專案，這也是題庫常考「與變更關係最密切的是監視及控制」的原因。</figcaption></figure>","points":[["五大流程群組","起始、規劃、執行、監視及控制、結束，是專案管理知識體系的骨架，幾乎每個知識領域都會對應到其中幾個群組。",1,[["起始 Initiating","正式確認專案或階段的存在並授權開始，主要產出是發展專案章程。"],["規劃 Planning","確定範疇、精進目標，擬定達成目標所需的行動方案與計畫書。"],["執行 Executing","完成專案管理計畫中界定的工作，把計畫付諸行動、符合專案規格。"],["監視及控制 Monitoring and Controlling","追蹤、審查與調整專案進度績效，識別需要的變更並發起。"],["結束 Closing","正式結束專案、階段或合約的所有活動，含行政結束與合約結束。"]],"辦發表會也分五階段：起始＝校方點頭同意辦、規劃＝排出流程表和分工、執行＝真正排練跟佈置、監視及控制＝總召隨時檢查進度對不對、結束＝表演完驗收成果、寫檢討。這五階段貫穿整個活動。"],["各流程群組的關聯性考點","與目標、時程、預算關係最密切的是「規劃」；與變更關係最密切的是「監視及控制」；把計畫付諸行動屬於「執行」。",1,null,"跟目標、時程、預算最有關的是「規劃」（先想好要花多少錢多少時間）；發現不對勁要調整，屬於「監視及控制」；真正動手佈置排練，屬於「執行」。"],["贊助者影響力最大的階段","利害關係人（尤其贊助者）的影響力在專案「起始」階段最大，隨專案進行逐漸遞減。",1,null,"校方（贊助者）在剛開始核准辦不辦、給多少經費時最有話語權；活動真正籌備起來之後，校方通常就比較不會一直插手細節了。"],["專案成本花費最多的階段","絕大多數的專案成本會在「執行」階段被花費掉，這點常跟「起始/規劃階段不確定性最高」放在一起考。",1,null,"辦活動的班費，大部分是在真正租道具、佈置、排練（執行）的時候花掉的，不是在申請核准或畫流程表的階段。"]]},{"name":"組織結構類型","diagram":"<figure><svg viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"五種組織結構中PM職權高低階梯圖，由功能式到專案式遞增\"><text x=\"300\" y=\"14\" class=\"fnote\">柱子越高，代表 PM 對專案資源與決策的職權越大</text><line x1=\"35\" y1=\"195\" x2=\"580\" y2=\"195\" class=\"faxis\"/><rect x=\"20\" y=\"170\" width=\"90\" height=\"25\" rx=\"4\" class=\"fbox solid\" fill=\"var(--u-color)\" fill-opacity=\"0.28\" stroke=\"none\"/><rect x=\"130\" y=\"140\" width=\"90\" height=\"55\" rx=\"4\" class=\"fbox solid\" fill=\"var(--u-color)\" fill-opacity=\"0.46\" stroke=\"none\"/><rect x=\"240\" y=\"105\" width=\"90\" height=\"90\" rx=\"4\" class=\"fbox solid\" fill=\"var(--u-color)\" fill-opacity=\"0.64\" stroke=\"none\"/><rect x=\"350\" y=\"70\" width=\"90\" height=\"125\" rx=\"4\" class=\"fbox solid\" fill=\"var(--u-color)\" fill-opacity=\"0.82\" stroke=\"none\"/><rect x=\"460\" y=\"35\" width=\"90\" height=\"160\" rx=\"4\" class=\"fbox solid\" fill=\"var(--u-color)\" fill-opacity=\"1\" stroke=\"none\"/><text x=\"65\" y=\"163\" class=\"fsub\">幾近無</text><text x=\"175\" y=\"133\" class=\"fsub\">有限</text><text x=\"285\" y=\"98\" class=\"fsub\">低～中</text><text x=\"395\" y=\"63\" class=\"fsub\">中～高</text><text x=\"505\" y=\"28\" class=\"fsub\">高～近乎全權</text><text x=\"65\" y=\"215\" class=\"flabel\">功能式</text><text x=\"175\" y=\"215\" class=\"flabel\">弱矩陣</text><text x=\"285\" y=\"215\" class=\"flabel\">平衡矩陣</text><text x=\"395\" y=\"215\" class=\"flabel\">強矩陣</text><text x=\"505\" y=\"215\" class=\"flabel\">專案式</text><text x=\"65\" y=\"230\" class=\"ftick\">PM≈0</text><text x=\"505\" y=\"230\" class=\"ftick\">PM≈全權</text></svg><figcaption>柱子高度＝ PM 對這種組織結構的掌控力：功能式最矮（PM 幾乎沒有正式職權，要跟功能經理要資源），一路墊高到專案式最高（PM 幾乎全權主導）。弱矩陣／平衡矩陣／強矩陣是中間三個過渡級距，差別就在 PM 跟功能經理誰的話語權比較大。</figcaption></figure>","points":[["五種組織結構光譜","從功能式到專案式，中間夾著弱矩陣/平衡矩陣/強矩陣，PM 的職權大小隨光譜遞增，是這個大類的核心考點。",1,[["功能式 Functional","依專業分組，PM 幾乎無正式職權，員工向單一功能經理負責、指揮系統清楚。"],["弱矩陣 Weak Matrix","PM 角色接近協調者／促進者（Expediter），權力小，仍受制於功能經理。"],["平衡矩陣 Balanced Matrix","PM 與功能經理權力相當，資源需雙方協調分配。"],["強矩陣 Strong Matrix","PM 有實質權力，但團隊成員仍同時向功能經理報告，易生雙重忠誠問題。"],["專案式 Projectized","PM 擁有最大獨立性與職權，大部分資源用於專案工作，團隊常同地辦公。"]],"辦活動的組織方式有五種，總召能指揮的力量由小到大：功能式（總召幾乎沒權力，要跟各班導師借人）→弱矩陣→平衡矩陣→強矩陣→專案式（總召幾乎說了算，大家全職投入）。"],["功能式組織的特徵","以專業為重心、依功能分組，所有員工向一位經理報告、指揮系統清楚，但專案工作不是重心，跨部門溝通協調較差。",0,null,"功能式就是大家還是聽自己班導師的，辦活動只是「順便幫忙」，各班要互相溝通協調比較麻煩。"],["專案式組織的優缺點","優點是 PM 權限最大、資源集中易於管理；缺點是專案結束後人員何去何從的問題、整體成本較高。",1,null,"專案式的好處是總召權力最大、好管理；壞處是活動辦完後，這群全職投入的人接下來要幹嘛就是個問題，整體花費也比較高。"],["矩陣式組織的雙重報告問題","團隊成員同時向 PM 與功能經理負責，容易產生資源使用衝突與部分人員雙重忠誠的問題。",1,null,"矩陣式組織裡，同一個同學要同時聽總召的、又要聽自己班導師的，兩邊萬一意見不合，這個同學就會很為難。"],["PM 權力大小的關鍵決定因素","組織結構類型是決定 PM 權力大小的關鍵因素，不是 PM 個人的溝通技巧或員工配合度。",1,null,"總召的權力大小主要是看學校用哪一種方式辦這個活動，不是看總召個人會不會講話、同學乖不乖。"]]},{"name":"專案管理知識體系與治理","points":[["專案治理架構的重要元素","含專案成功及交付的允收準則、決策流程、專案團隊與外部利害關係人的關係；不包含「專案的可行性分析」（那是起始前的事）。",1,null,"專案治理講的是這場活動「怎麼判斷辦得好不好、誰能拍板決定、跟外部廠商怎麼合作」的一套規則，不包含「一開始要不要辦」這種起始前的評估。"],["企業環境因素 EEF","指組織文化、人事制度、既有 ERP 系統等「當下」的環境條件——不是專案團隊能控制、但會影響專案，是多數規劃子流程的投入；「過去執行類似專案的經驗」不算 EEF，那屬於組織流程資產（OPA）的歷史資訊，題庫明確考過這個易混淆點（F3010058）。",1,null,"企業環境因素就是學校『現在』既有的大環境——像校風、校規、原本就有的場地器材——這些是這次活動自己控制不了、但會影響活動的東西；『以前辦過類似活動的經驗紀錄』則算另一種東西（組織流程資產），常有人搞混，要分清楚。"],["專案管理應用知識的三面向","一般管理知識＋應用領域知識＋工具技術與方法，並非只靠專案管理軟體或純理論、也不能忽略實務經驗。",0,null,"會辦活動，不能只靠課本理論或APP排程工具，要同時具備「基本管理常識」＋「這種活動的專業知識（例如懂音響燈光）」＋「實際辦過的經驗」三種能力。"]]},{"name":"專案組合與計畫管理","points":[["Project／Program／Portfolio 三層級","組合（Portfolio）統籌多個計畫與專案以達成組織策略目標；計畫（Program）管理彼此緊密相依的多個專案；專案（Project）是最小的一次性努力單位。",1,[["專案 Project","為創建一獨特的產品、服務或結果所做的一次性努力。"],["計畫 Program","管理多個彼此有緊密相依關係、協調一致的相關專案，以獲得單獨管理無法取得的效益。"],["組合 Portfolio","將專案、計畫及其他工作分組，以有效管理達成策略目標，各項目間不一定緊密相依。"]],"由小到大排：專案是一件事，例如辦畢業成果發表會；計畫是好幾個互相有關的專案一起管，例如整個畢業季（發表會＋畢業旅行＋典禮）；組合是學校把全校所有活動放在一起看，決定哪些該辦、哪些該砍，彼此不一定有關係。"],["專案管理辦公室 PMO","負責跨專案的組合管理、專案評選與組織策略排序，常出現在「主管正評估多個與策略目標相關的專案」情境題。",0,null,"PMO 就像學校的活動組／學務處，專門管「全校所有活動」，負責看哪些活動該優先辦、幫忙評估、排優先順序。"],["專案組合管理的內容","建立投資策略、評價專案的優先順序、建立可實現投資目標的組合——不含消費者研究這種單一專案層級的作業。",0,null,"組合管理做的事：訂出學校想發展的方向、決定哪些活動優先辦、湊出一組能達成學校目標的活動組合，不包含「問卷調查這場活動好不好玩」這種單一活動層級的細節工作。"]]}]},{"name":"專案起始（Initiating）","short":"起始","count":20,"key":"c2","subtopics":[{"name":"起始流程核心文件","points":[["三大核心文件","工作說明書（SOW）、專案章程（Charter）、產品說明書，是起始階段考最密集的三份文件，容易混淆彼此的撰寫者與用途。",1,[["工作說明書 SOW","敘述專案承諾要完成的產品或服務，通常由需求者、業主或委託人撰寫。"],["專案章程 Project Charter","正式核准並授權 PM 在專案活動中動用組織資源的文件，用來確認專案的存在。"],["產品說明書","說明產品或服務特性及專案早期細節的一項投入（Input），不是產出。"]],"起始階段最愛考的三份文件：需求書（校方寫的「我要辦成怎樣」的要求）、專案章程（正式核准這場活動可以用資源的公文）、成果說明（描述表演內容大概長怎樣的補充資料）。"],["SOW 由誰撰寫","通常由需求者、業主或委託人提供，而不是 PM 或專案贊助者自己寫。",0,null,"需求書是校方/委託單位自己寫的，告訴總召他們要什麼，不是總召或指導老師幫他們寫。"],["章程的核心目的","確認專案目標並授權取得專案資源、確認專案的存在，不是「敘述專案的評選方法」。",1,null,"章程最重要的功能：正式宣布「這場活動可以辦了」，並授權總召去動用班費和人力，不是拿來寫「要不要辦」的評估方法。"],["章程產生於哪個流程群組","專案章程在「起始（Initiating）」流程群組中產生。",0,null,"活動章程（核准公文）是在「起始」這個階段就會產生的文件。"],["確認專案存在的文件","是專案章程，而不是 WBS、預算基準或整體專案計畫。",1,null,"能證明「這場活動正式核准了」的文件是章程，不是分工清單、經費表或整份籌備計畫書。"]]},{"name":"發展專案章程","points":[["發展專案章程的四項投入","工作說明書、專案評選方法、企業環境及資源、組織流程，四項合併出題的機率很高。",1,[["工作說明書 SOW","敘述專案承諾完成的產品或服務。"],["專案評選方法","如本益比分析等，用來判斷是否啟動這個專案。"],["企業環境及資源","組織既有的環境條件與可用資源。"],["組織流程","組織既有的流程與制度規範。"]],"要寫出章程，需要先有這四樣東西：校方給的需求書、評估這場活動值不值得辦的方法、學校現有的場地資源、學校原本辦活動的規定流程。"],["章程可能的內容","常見的是總體預算、PM 人選、專案目的，「專案經驗」不是章程正式會納入的內容。",0,null,"章程裡通常會寫：總經費大概多少、誰當總召、辦這場活動的目的是什麼；但不會寫「以前辦過類似活動的經驗」這種內容。"],["PM 指派的最佳時機","理想狀況下 PM 應該在章程階段就被指定，越早介入越能掌握專案全貌。",0,null,"總召最好在寫章程的階段就先確定人選，越早加入越能掌握整場活動的全貌。"]]},{"name":"利害關係人識別與分析","points":[["利害關係人的定義範圍","受專案活動影響、或能影響專案的個人與團體都算，範圍很廣——贊助者、顧客、供應商、決策階層都可能是。",0,null,"只要「受這場活動影響、或能影響這場活動」的人，都算利害關係人——範圍很廣，觀眾、校方、廠商、校長都可能算在內。"],["利害關係人分析的重點","分析利害關係人的期望、影響力、與專案的接近程度（參與程度）；「社會及經濟狀況」不是分析重點。",1,null,"分析利害關係人主要看：他們期待看到什麼、他們的話語權有多大、他們會不會常常來關心進度——「家裡經濟狀況」不是分析重點。"],["對降低成本最關切的一方","通常是贊助者或高階決策層／出資方，而非執行團隊本身。",0,null,"最在意「能不能省班費」的通常是校方（贊助者）或掏錢的人，不是實際跑腿籌備的同學。"],["蒐集需求後可先忽略的期望","當關鍵利害關係人期望明確後，與專案目標無關或優先順序明顯較低的期望可以先忽略，需依重要性判斷取捨。",0,null,"如果已經確認了校方和主要人物的期待，那些跟這次目標無關、或明顯不重要的小要求，可以先放一邊，要看重要性來取捨。"]]},{"name":"效益衡量與專案評選","points":[["本益比分析比較兩專案","比較執行成本現值、利益現值、營運成本現值，算出淨獲利現值較高者優先推薦——是起始階段最常考的計算題型。",1,null,"如果同時有兩個活動企劃可以選，就是把「要花多少班費」跟「能得到多少好處」都換算成現在的價值來比，選划算比較多的那個——這是起始階段最常考的計算題。"]]}]},{"name":"專案規劃（Planning）","short":"規劃","count":130,"key":"c3","subtopics":[{"name":"品質規劃","points":[["品質定義的四種取向","製造者導向、產品導向、消費者導向、價值導向，同一題常換句話問「哪一項不是」某取向的定義。",1,[["製造者導向","是否符合規格與需求（Conformance to Requirements）。"],["產品導向","看產品本身具備的屬性與特性。"],["消費者導向","適合使用（Fitness for Use），滿足顧客實際需求。"],["價值導向","兼顧使用效益與售價，是最佳條件的組合。"]],"表演品質可以從四個角度看：有沒有照排練規劃演（製作者角度）、演出本身精不精彩（產品角度）、觀眾看得爽不爽（消費者角度）、划不划算（效果好、花費又合理）。"],["戴明（Deming）的品質觀點","改善製程、提高產品品質一致性、減少重工與浪費，不是「生產力是品質的副產品」這類敘述。",0,null,"戴明認為表演品質要靠「改善排練流程」來提升，讓每次表演都穩定發揮、減少重做浪費時間，不是「排練順了，品質自然會變好」這種倒果為因的說法。"],["品質機能展開 QFD","把消費者需求轉換為可測知的產品屬性，效果包含縮短總設計時間、降低試製成本，但不含「增加設計工程變更」。",0,null,"QFD 就是把「觀眾想看什麼」轉換成「表演要設計成什麼樣子」的具體內容，可以縮短籌劃時間、降低試演成本，但不會讓內容一直改來改去。"],["規劃品質管理的產出","品質管理計畫書、品質指標（Quality Metrics）、品質檢核表；「操作定義」不在這裡，那屬於控制品質的範疇。",1,null,"規劃品質這一步最後會產出：品質計畫書、要達到什麼標準的指標、檢核表，不包含「怎麼操作驗收」的細節（那是後面控制品質才會用到的東西）。"],["專案式（任務編組）組織特性","臨時性動態組織、資源可充分利用、易增加跨部門溝通機會，但也容易出現本位主義與雙重忠誠問題。",0,null,"專案式（任務編組）就是臨時湊起來的班隊，人力比較能靈活調度、跨班合作機會多，但也容易各做各的、有人要同時聽兩邊的話。"]]},{"name":"範疇與 WBS","points":[["範疇聲明書不包含的內容","範疇聲明書（Scope Statement）不包含「成本估計」，成本估計屬於成本管理領域的另一份產出。",1,null,"範疇聲明書（說明這次活動要做什麼內容）裡面不會有「要花多少班費」，經費是另外一份文件的事。"],["定義範疇（Define Scope）的產出","產出是專案範疇說明書、專案文件更新，不含「成本變更」或「風險分析」。",0,null,"把要做的內容定義清楚後，會產出「範疇說明書」和更新過的活動文件，不會產出「經費變更」或「風險分析」。"],["建立 WBS 的四項投入","範疇管理計畫書、專案範疇說明書、需求文件、組織流程資產，四項齊全才算完整投入。",1,[["範疇管理計畫書","規範如何定義、確認與控制專案範疇。"],["專案範疇說明書","詳述專案範疇、主要交付標的與允收準則。"],["需求文件","記錄利害關係人對專案的具體需求。"],["組織流程資產","組織既有的範本、政策、歷史資料等。"]],"要把活動拆解成一項項工作清單之前，要先準備好：怎麼定內容範圍的規則、範疇說明書本身、大家的需求記錄、學校原本的範本資料，四樣要齊全。"],["WBS 最下層是工作包","工作分解結構（WBS）最下層／最底層稱為工作包（Work Package），是有助於成本、時間估計與工作分派的最小管理單位。",1,null,"工作清單一層一層拆到最細，最底下那一項叫「工作包」，是拿來估花多少班費、多少時間、分派給誰做的最小單位——例如「訂購舞台燈光」就是一個工作包。"],["定義活動（Define Activities）的產出","產出是活動清單、活動屬性、里程碑清單，不含「請求的變更」。",0,[["活動清單 Activity List","列出所有需要完成的排程活動。"],["活動屬性 Activity Attributes","描述每項活動的細節，如負責人、地點、限制等。"],["里程碑清單 Milestone List","列出專案的重要時間點，是否為強制性里程碑也會標註。"]],"把要做的事拆成一個個具體任務之後，會產出：任務清單、每個任務的細節（誰負責、地點限制）、重要時間點清單，不包含「要求變更」這種東西。"]]},{"name":"時程規劃","diagram":"<figure><svg viewBox=\"0 0 640 600\" role=\"img\" aria-label=\"前導圖四種邏輯關係對照圖，仿甘特圖畫法，四種關係各自獨立成一個外框，A活動與B活動分別用綠色與紅色標示\"><defs><marker id=\"seq-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"var(--ink-2)\"/></marker></defs><rect x=\"215\" y=\"4\" width=\"20\" height=\"16\" rx=\"4\" fill=\"var(--u-color)\"/><text x=\"240\" y=\"17\" class=\"fsub\" text-anchor=\"start\">A 活動</text><rect x=\"335\" y=\"4\" width=\"20\" height=\"16\" rx=\"4\" fill=\"var(--accent-ring)\"/><text x=\"360\" y=\"17\" class=\"fsub\" text-anchor=\"start\">B 活動</text><rect x=\"14\" y=\"36\" width=\"612\" height=\"122\" rx=\"10\" fill=\"var(--u-tint)\" stroke=\"var(--u-color)\" stroke-width=\"1.5\"/><rect x=\"14\" y=\"174\" width=\"612\" height=\"122\" rx=\"10\" fill=\"var(--u-tint)\" stroke=\"var(--u-color)\" stroke-width=\"1.5\"/><rect x=\"14\" y=\"312\" width=\"612\" height=\"122\" rx=\"10\" fill=\"var(--u-tint)\" stroke=\"var(--u-color)\" stroke-width=\"1.5\"/><rect x=\"14\" y=\"450\" width=\"612\" height=\"128\" rx=\"10\" fill=\"var(--u-tint)\" stroke=\"var(--u-color)\" stroke-width=\"1.5\"/><g stroke=\"var(--hairline)\" stroke-width=\"1\"><line x1=\"140\" y1=\"64\" x2=\"140\" y2=\"136\"/><line x1=\"240\" y1=\"64\" x2=\"240\" y2=\"136\"/><line x1=\"340\" y1=\"64\" x2=\"340\" y2=\"136\"/><line x1=\"440\" y1=\"64\" x2=\"440\" y2=\"136\"/><line x1=\"540\" y1=\"64\" x2=\"540\" y2=\"136\"/><line x1=\"140\" y1=\"202\" x2=\"140\" y2=\"274\"/><line x1=\"240\" y1=\"202\" x2=\"240\" y2=\"274\"/><line x1=\"340\" y1=\"202\" x2=\"340\" y2=\"274\"/><line x1=\"440\" y1=\"202\" x2=\"440\" y2=\"274\"/><line x1=\"540\" y1=\"202\" x2=\"540\" y2=\"274\"/><line x1=\"140\" y1=\"340\" x2=\"140\" y2=\"412\"/><line x1=\"240\" y1=\"340\" x2=\"240\" y2=\"412\"/><line x1=\"340\" y1=\"340\" x2=\"340\" y2=\"412\"/><line x1=\"440\" y1=\"340\" x2=\"440\" y2=\"412\"/><line x1=\"540\" y1=\"340\" x2=\"540\" y2=\"412\"/><line x1=\"140\" y1=\"478\" x2=\"140\" y2=\"550\"/><line x1=\"240\" y1=\"478\" x2=\"240\" y2=\"550\"/><line x1=\"340\" y1=\"478\" x2=\"340\" y2=\"550\"/><line x1=\"440\" y1=\"478\" x2=\"440\" y2=\"550\"/><line x1=\"540\" y1=\"478\" x2=\"540\" y2=\"550\"/></g><text x=\"320\" y=\"52\" class=\"flabel\">完成-開始 FS（最常用）</text><rect x=\"60\" y=\"68\" width=\"220\" height=\"28\" rx=\"7\" fill=\"var(--u-color)\"/><text x=\"170\" y=\"87\" class=\"flabel on-solid\">活動 A</text><rect x=\"360\" y=\"104\" width=\"220\" height=\"28\" rx=\"7\" fill=\"var(--accent-ring)\"/><text x=\"470\" y=\"123\" class=\"flabel on-solid\">活動 B</text><path d=\"M280,82 C320,82 320,118 360,118\" class=\"fline\" stroke=\"var(--ink-2)\" marker-end=\"url(#seq-arrow)\"/><circle cx=\"280\" cy=\"82\" r=\"5\" fill=\"var(--ink-2)\"/><circle cx=\"360\" cy=\"118\" r=\"5\" fill=\"var(--ink-2)\"/><text x=\"320\" y=\"144\" class=\"fnote\">A「完成」的那一刻，B 才能「開始」</text><text x=\"320\" y=\"190\" class=\"flabel\">開始-開始 SS</text><rect x=\"100\" y=\"206\" width=\"220\" height=\"28\" rx=\"7\" fill=\"var(--u-color)\"/><text x=\"210\" y=\"225\" class=\"flabel on-solid\">活動 A</text><rect x=\"100\" y=\"242\" width=\"320\" height=\"28\" rx=\"7\" fill=\"var(--accent-ring)\"/><text x=\"260\" y=\"261\" class=\"flabel on-solid\">活動 B</text><path d=\"M100,220 L100,256\" class=\"fline\" stroke=\"var(--ink-2)\" marker-end=\"url(#seq-arrow)\"/><circle cx=\"100\" cy=\"220\" r=\"5\" fill=\"var(--ink-2)\"/><circle cx=\"100\" cy=\"256\" r=\"5\" fill=\"var(--ink-2)\"/><text x=\"320\" y=\"282\" class=\"fnote\">A「開始」的那一刻，B 也跟著「開始」</text><text x=\"320\" y=\"328\" class=\"flabel\">完成-完成 FF</text><rect x=\"60\" y=\"344\" width=\"320\" height=\"28\" rx=\"7\" fill=\"var(--u-color)\"/><text x=\"220\" y=\"363\" class=\"flabel on-solid\">活動 A</text><rect x=\"200\" y=\"380\" width=\"180\" height=\"28\" rx=\"7\" fill=\"var(--accent-ring)\"/><text x=\"290\" y=\"399\" class=\"flabel on-solid\">活動 B</text><path d=\"M380,358 L380,394\" class=\"fline\" stroke=\"var(--ink-2)\" marker-end=\"url(#seq-arrow)\"/><circle cx=\"380\" cy=\"358\" r=\"5\" fill=\"var(--ink-2)\"/><circle cx=\"380\" cy=\"394\" r=\"5\" fill=\"var(--ink-2)\"/><text x=\"320\" y=\"420\" class=\"fnote\">A「完成」的那一刻，B 也跟著「完成」</text><text x=\"320\" y=\"466\" class=\"flabel\">開始-完成 SF（最少見）</text><rect x=\"340\" y=\"482\" width=\"220\" height=\"28\" rx=\"7\" fill=\"var(--u-color)\"/><text x=\"450\" y=\"501\" class=\"flabel on-solid\">活動 A</text><rect x=\"120\" y=\"518\" width=\"220\" height=\"28\" rx=\"7\" fill=\"var(--accent-ring)\"/><text x=\"230\" y=\"537\" class=\"flabel on-solid\">活動 B</text><path d=\"M340,496 L340,532\" class=\"fline\" stroke=\"var(--ink-2)\" marker-end=\"url(#seq-arrow)\"/><circle cx=\"340\" cy=\"496\" r=\"5\" fill=\"var(--ink-2)\"/><circle cx=\"340\" cy=\"532\" r=\"5\" fill=\"var(--ink-2)\"/><text x=\"320\" y=\"558\" class=\"fnote\">A「開始」的那一刻，B 才能「完成」</text></svg><figcaption>綠色是活動 A，紅色是活動 B，色塊長度代表持續期間，背景細直線是輔助對齊用的時間刻度（仿甘特圖畫法）。灰色圓點標出箭頭實際連接的那個時間點——四種關係只差在「連接 A 的起點還是迄點」對「B 的起點還是迄點」，這正是考試最愛互換著考的地方。</figcaption></figure>","points":[["CPM 要徑法 vs PERT 計畫評核術","CPM 用單時估算法、以經驗數據為基礎，適合確定性較高的專案；PERT 用三點估算法，適合高不確定性、複雜度高的專案。",1,[["CPM 要徑法","以經驗數據為基礎的單時估算，找出工期最長、浮時為零的路徑。"],["PERT 計畫評核術","用樂觀、最可能、悲觀三個時間加權估算，適合風險與不確定性高的專案。"]],"排練表要抓多久，有兩種算法：一種是「上次辦活動花了幾天，這次差不多」直接抓一個數字（CPM），適合常辦、有把握的活動；另一種是抓「最順利、最可能、最衰」三個猜測取平均（PERT），適合第一次辦、沒把握的活動。"],["PERT 三點估算公式","期望值 =（樂觀時間 + 4 × 最可能時間 + 悲觀時間）÷ 6；標準差 =（悲觀時間 − 樂觀時間）÷ 6，是這個大類最常出現的計算題。",1,null,"PERT 估時間的公式：（最順利花的天數 + 4×最可能花的天數 + 最衰花的天數）÷6，是這個章節最常出現的計算題。"],["前導圖四種邏輯關係（AON）","完成-開始（FS）最常用，其餘還有開始-開始（SS）、完成-完成（FF）、開始-完成（SF），要能分辨圖示對應哪一種。",1,[["完成-開始 FS","前一活動完成後，後一活動才能開始，最常用的邏輯關係。"],["開始-開始 SS","前一活動開始後，後一活動才能開始。"],["完成-完成 FF","前一活動完成後，後一活動才能完成。"],["開始-完成 SF","前一活動開始後，後一活動才能完成，最少見。"]],"任務之間的先後關係有四種：最常見的是「舞台架好才能掛布景」（前一個做完，後一個才能開始）；還有「兩組同時開工」（一起開始）、「兩組要同時收尾」（一起結束）、很少見的「前一個一開工，後一個才能收尾」。"],["要徑（Critical Path）的特性","是網路圖中期程最長的路徑，路徑上活動的浮時（Float）為零，但活動的自由浮時不一定是零。",0,null,"要徑就是整張排練表裡「花最多天數」的那條路線，這條路線上的每個任務完全不能拖延，不然表演那天就會來不及。"],["縮程法 vs 快速跟進","縮程法（Crashing）通常需要增加成本／資源；快速跟進（Fast Tracking）讓活動平行進行、常會有重工（Rework）的情況發生。",1,[["縮程法 Crashing","增加資源投入以縮短工期，通常會增加成本。"],["快速跟進 Fast Tracking","把原本前後相連的活動改成同時進行，常導致重工。"]],"想提早準備好有兩招：一是「多找人多花錢趕工」（縮程法），會花更多班費；二是「本來要先後做的事改成同時做」（快速跟進），容易因為前面還沒做完，後面就要重做。"],["浮時（Float）為負的處置","浮時 = −5 時代表已經落後於進度，最適宜的處置是使用資源撫平或趕工手段，而非放任不管。",0,null,"如果算出來已經落後了（例如慢了5天），要趕快用多找人手或加緊趕工的方式補救，不能放著不管、等表演那天再說。"]]},{"name":"成本估算與財務評估","points":[["三種財務評估方法","淨現值 NPV、內部報酬率 IRR、還本期 Payback Period，是規劃階段最常考的專案遴選計算題型。",1,[["淨現值 NPV","現金流量折現後加總，選擇 NPV 最大的專案，假設以資金成本重複投資。"],["內部報酬率 IRR","使 NPV 等於零的折現率，選擇 IRR 最高的專案。"],["還本期 Payback Period","回收投資所需的時間，是最不精確的方法，因為不考慮金錢的時間價值。"]],"評估要不要投入辦一個活動有三種算法：換算成現在值多少錢，選划算最多的（淨現值）；換算成一個報酬率百分比，選最高的（內部報酬率）；多久能回本，選最快的，但這個方法最不準（還本期）。"],["成本估算的三種技術","類比估算法（速度快、精度低）、由下而上估算法（精度高、耗時）、專家判斷，是規劃品質管理常用的工具技術之一。",0,null,"估班費常用三招：類比估算（跟去年類似活動比一下，快但不準）、由下而上估算（一項一項細算，準但花時間）、專家判斷（請辦過的學長姐幫忙估）。"],["學習曲線理論","強調生產數量增加時，平均單位成本會下降，不是單純指「生產率上升時成本減少」。",0,null,"學習曲線的意思是：同樣的道具做得越多次，因為越做越熟練，平均一件花的時間和成本就會越來越少。"],["成本基準 Cost Baseline","是按時間分段的預算，用來衡量及監控專案整體績效，不等於專案的實際支出成本（Actual Cost）。",1,null,"成本基準是「照時間排好的整體班費預算表」，拿來當作檢查花費對不對的比較標準，不等於「實際已經花掉的錢」。"],["成本類別的區分","固定成本、變動成本、直接成本、間接成本要能對應到具體情境，例如設備租賃通常算固定成本。",0,null,"花費可以分好幾種：固定不變的、會隨數量變動的、直接花在這場活動上的、大家分攤的——要能判斷一筆花費屬於哪一種，例如租音響設備的錢通常算固定成本。"]]},{"name":"風險規劃","points":[["負面風險的四大應對策略","規避（Avoidance）、轉移（Transfer）、減輕（Mitigation）、接受（Acceptance），是風險規劃最核心的分類考點。",1,[["規避 Avoidance","改變計畫以完全消除威脅或保護專案目標不受影響。"],["轉移 Transfer","把風險的後果連同應對責任轉移給第三方，如購買保險。"],["減輕 Mitigation","採取行動降低風險發生機率或衝擊程度。"],["接受 Acceptance","不採取行動改變風險，除非風險真的發生才處理。"]],"碰到可能出包的事，有四種因應方式：規避（想辦法讓這件事根本不會發生，例如室內場地不怕下雨）、轉移（花錢請別人扛，例如租保險）、減輕（想辦法降低發生機率或影響，例如多備一套道具）、接受（不特別處理，真的發生再說）。"],["定性風險分析 vs 定量風險分析","定性用機率與衝擊矩陣排定風險優先順序，產出風險分數；定量用統計數值（如蒙地卡羅模擬）量化風險對專案目標的整體衝擊。",1,[["定性風險分析","評估風險的機率和影響程度，排定風險的優先順序。"],["定量風險分析","以數學模式或統計機率值，量化風險對專案整體目標的衝擊。"]],"定性分析是用「可能性x影響程度」這種簡單方式，先排出哪些出包狀況比較嚴重、要先處理；定量分析則是用數字統計方法，更精確地算出這件事對整場活動的實際衝擊。"],["三種常見風險分析工具","決策樹分析（找出決定因子）、龍捲風圖／敏感度分析（顯示資料敏感度）、蒙地卡羅模擬（以機率分布取代定值估算）。",1,[["決策樹 Decision Tree","用來輔助決策的圖形工具，找出影響決策的關鍵因子。"],["龍捲風圖 Tornado Diagram","常用於顯示資料的敏感度分析結果。"],["蒙地卡羅模擬 Monte Carlo Simulation","運用數學模式將成本或時程變數執行多次，以機率分布取代定值估算。"]],"常用來分析風險的三個工具：決策樹（畫出不同決定會有什麼後果的樹狀圖）、龍捲風圖（看哪個因素影響最大）、電腦模擬（讓電腦跑很多次不同狀況，估出比較準的結果）。"],["風險的三個特性","事件之發生（機率）、事件發生對結果的影響（衝擊）、發生的不確定時間點，三者合稱風險的基本特性。",0,null,"風險有三個要素：這件事會不會發生（可能性）、發生了會怎樣（影響）、什麼時候會發生（不確定的時間點，例如不知道會不會下雨）。"],["風險管理計畫書的角色","是所有其餘規劃風險工作的投入（Input），內容含門檻值、評分與解釋方法、負責人、預算。",0,null,"風險管理計畫書會先講好：多嚴重才算是「出包」、怎麼打分數、誰負責處理、預留多少應變金，後面所有跟風險有關的事都照這份計畫走。"]]},{"name":"採購與人力資源規劃","points":[["合約類型與風險歸屬","固定價格合約對買方風險最低、對賣方風險最高；成本補償類合約（成本加固定費用／加獎勵／加佣金）則相反。",1,[["固定價格合約","價格在簽約時就固定，買方風險最低、賣方需自行吸收超支風險。"],["成本加固定費用","依實際成本支付並加上固定利潤，賣方風險較低。"],["成本加獎勵費用","依成本支付並依績效給予獎勵，兼顧成本控制與誘因。"],["時間與材料合約 T&M","依實際工時與材料計價，適合範疇不明確的小型工作。"]],"跟廠商簽約有不同的風險分配方式：固定價格（一開始就講好價錢，廠商要自己承擔超支的風險，對你們最安全）；成本補償（依實際花費付錢再加一點利潤，廠商風險比較小）；工時加材料（依工作時數加材料計價，適合內容講不清楚的小案子）。"],["人力資源規劃的投入與產出","投入是企業環境因素、組織流程資產、專案管理計畫；產出是角色與責任、專案組織圖、人員管理計畫。",1,[["投入：企業環境因素","組織文化、現有人力資源與人事管理制度等外部條件。"],["投入：組織流程資產","組織既有的範本與政策。"],["產出：專案組織圖","顯示專案報告關係的圖表。"],["產出：人員管理計畫","敘述人力資源如何及何時取得與釋出。"]],"規劃要找哪些人手，需要先看學校的環境和資源、原本的規定、活動計畫書；規劃完後會產出：誰負責什麼、分工組織圖、每個人什麼時候加入退出的時間表。"],["溝通管理計畫書的四項內容","利害關係人的溝通需求、溝通目的與頻率、溝通格式與傳送方法、分發時間範圍與負責分發者。",1,null,"溝通計畫書要講清楚四件事：誰需要知道什麼消息、多久開一次會或報告一次、用什麼方式聯絡（Line群組還是紙本）、什麼時候該由誰負責發消息。"],["規劃人力資源管理的正確敘述","是確定、記錄並分派專案角色、職責和報告關係、制定人員管理計畫，而不是直接去招募人力（那是執行階段的工作）。",0,null,"規劃人力這一步，是先確定「誰做什麼、誰要跟誰報告」並訂出人員時間表，不是直接跑去找人來加入——找人加入是後面執行階段的事。"]]}]},{"name":"專案執行（Executing）","short":"執行","count":130,"key":"c4","subtopics":[{"name":"團隊發展與組織行為","diagram":"<figure><svg viewBox=\"0 0 640 235\" role=\"img\" aria-label=\"Tuckman團隊發展五階段績效曲線圖\"><text x=\"320\" y=\"14\" class=\"fnote\">Tuckman 團隊發展模型：績效隨階段推進而變化</text><line x1=\"30\" y1=\"205\" x2=\"610\" y2=\"205\" class=\"faxis\"/><text x=\"600\" y=\"222\" class=\"ftick\">時間 →</text><path d=\"M60,140 Q125,182 190,172 Q255,160 320,100 Q385,52 450,48 Q515,55 580,102\" class=\"fline\" fill=\"none\"/><circle cx=\"60\" cy=\"140\" r=\"5\" fill=\"var(--u-color)\"/><circle cx=\"190\" cy=\"172\" r=\"5\" fill=\"var(--u-color)\"/><circle cx=\"320\" cy=\"100\" r=\"5\" fill=\"var(--u-color)\"/><circle cx=\"450\" cy=\"48\" r=\"5\" fill=\"var(--u-color)\"/><circle cx=\"580\" cy=\"102\" r=\"5\" fill=\"var(--u-color)\"/><text x=\"60\" y=\"168\" class=\"flabel\">組建</text><text x=\"60\" y=\"184\" class=\"fsub\">Forming</text><text x=\"190\" y=\"196\" class=\"flabel\">風暴</text><text x=\"190\" y=\"212\" class=\"fsub\">Storming・績效最低</text><text x=\"320\" y=\"80\" class=\"flabel\">正軌</text><text x=\"320\" y=\"66\" class=\"fsub\">Norming</text><text x=\"450\" y=\"30\" class=\"flabel\">展現</text><text x=\"450\" y=\"16\" class=\"fsub\">Performing・績效高峰</text><text x=\"580\" y=\"128\" class=\"flabel\">解散</text><text x=\"580\" y=\"144\" class=\"fsub\">Adjourning</text></svg><figcaption>績效不是一路往上：風暴期（Storming）成員意見衝突，效能反而是全程最低點；撐過磨合、進入正軌（Norming）後才開始明顯提升，在展現期（Performing）達到高峰。這條「先降後升」的曲線正是題庫最愛考的重點。</figcaption></figure>","points":[["團隊發展五階段","組建（Forming）、風暴（Storming）、正軌（Norming）、展現（Performing）、解散（Adjourning），是執行大類最高頻的考點之一。",1,[["組建 Forming","團隊剛成立，成員彼此陌生、依賴指示行事。"],["風暴 Storming","團隊開始出現意見衝突與競爭，磨合最劇烈的階段。"],["正軌 Norming","團隊發展出共同工作方式，開始建立信任與默契。"],["展現 Performing","團隊發展出彼此的感情與熟悉，共同做決策、高效產出。"],["解散 Adjourning","專案或階段結束，團隊完成任務後解散。"]],"分組籌備活動就像交朋友，有五個階段：剛分到同一組還在摸索（組建）→分工意見不合開始吵架（風暴）→吵完後找到相處默契（正軌）→合作超順、效率最高（展現）→表演結束大家解散（解散）。"],["虛擬團隊 Virtual Team","可以組建工作地點十分分散、但同屬一個組織的團隊，也可以納入行動不便或在家辦公的員工，用來降低差旅成本限制。",0,null,"虛擬團隊就是組員各自在家用視訊開會、線上分工，不用每天到校集合，但還是算同一組，這樣可以省下通勤的時間。"],["發展專案團隊的工具技術","集中辦公（Co-location）、訓練（Training）、團隊建立活動、認可與獎勵系統，都是提升團隊凝聚力的常見手段。",0,null,"讓小組變得更有默契的方法：安排大家常聚在一起討論、辦個小訓練、玩個團康破冰遊戲、表現好給點獎勵——這些都能增加向心力。"],["溝通管道公式","溝通管道數 = n(n-1)/2，團隊人數增加時常考「會增加多少溝通管道」的計算題。",1,null,"溝通管道數 = n(n-1)÷2，n 是組員人數——常考「小組多加幾個人後，要多顧到幾條溝通線」的計算題。"],["資源撫平 vs 資源分派","資源撫平（Resource Leveling）可能延長時程，但讓人力需求分布保持平穩；被迫資源分派通常代表人力需求過度集中在某階段。",0,null,"資源撫平是為了讓需要人手的時間平均分散開，可能會拉長籌備天數；如果不撫平、硬照原計畫做，某幾天就會突然需要一堆人手、忙到爆。"],["X 理論 vs Y 理論","Y 理論假設人不需要被持續監督、被預期是勤奮且自動自發；X 理論假設人沒有能力自主管理、經理需嚴格監控部屬履行職責。",1,[["X 理論","假設人天生厭惡工作、缺乏自主管理能力，需要嚴格監督與控制。"],["Y 理論","假設人自動自發、能自我管理，只需要適度的激勵和期望。"]],"Y 理論認為組員是自動自發、不太需要人盯的；X 理論則認為組員天生懶得動，需要幹部緊盯著才會做事。"]]},{"name":"領導、權力與衝突管理","points":[["五種權力基礎","領袖權力（Referent）、專家權力（Expert）、合法權力（Legitimate）、獎勵權力（Reward）、強制權力（Coercive），常考「哪一種權力是因為受屬下高度尊敬」。",1,[["領袖權力 Referent Power","來自對領導者的高度尊敬與認同，屬下願意執行其決策。"],["專家權力 Expert Power","來自 PM 本身的專業知識與技能。"],["合法權力 Legitimate Power","來自組織正式授予的職位與職權。"],["獎勵權力 Reward Power","來自 PM 能給予獎勵的能力。"],["強制權力 Coercive Power","來自 PM 能施加懲罰的能力，長期使用易傷害團隊關係。"]],"總召的權力來源有五種：因為大家佩服你（領袖權力）、因為你懂專業（專家權力）、因為你的職位頭銜（合法權力）、因為你能給獎勵（獎勵權力）、因為你能記人小過（強制權力，用多了會傷感情）。"],["五種衝突解決模式","問題解決／面對（Confronting）、妥協（Compromising）、退卻／擱置（Withdrawal）、安撫（Smoothing）、強迫（Forcing），是考最密集的衝突處理題型。",1,[["問題解決 Confronting","直接面對問題根源，尋求雙贏解法，一般認為是最有效的方式。"],["妥協 Compromising","雙方各退一步，找到都能接受的折衷方案。"],["退卻 Withdrawal","延後或迴避處理衝突，屬於消極手段。"],["安撫 Smoothing","強調雙方的共同點、淡化差異，但不解決根本問題。"],["強迫 Forcing","以權力壓制對方接受己方觀點，屬於「以我方案為準」的作法。"]],"組員吵架有五種處理方式：直接坐下來面對問題找雙贏方法（最有效）、雙方各退一步（妥協）、先擱著不管（退卻，比較消極）、只講兩邊的共同點不解決根本問題（安撫）、總召直接下令要求聽話（強迫）。"],["PM 領導風格隨團隊階段調整","領導型態要配合團隊發展的不同階段，通常依「指導、訓練、支持、委派」的連續步驟調整。",0,null,"總召帶組員的方式要隨著小組發展階段調整，大概是「先手把手教→再訓練→再從旁支持→最後放手讓他們自己做」這樣的順序。"],["新成員加入展現階段的影響","團隊可能會短暫回到風暴（Storming）階段重新磨合，但通常能較快回到展現（Performing）階段。",0,null,"如果小組已經很有默契了（展現期）又臨時加入新同學，可能會短暫回到吵架磨合的風暴期，但通常能很快再回到有默契的狀態。"],["溝通模式的過濾因素","接收者會透過文化考量、情感、態度等因素過濾他們接收到的資訊，這是溝通失真的常見原因。",0,null,"聽的人會用自己當下的心情、態度、成見來過濾接收到的訊息，這是同學之間傳話常常會走樣、誤會的原因。"]]},{"name":"品質保證與稽核","points":[["執行品質保證常用工具技術","品質稽核（Quality Audits）、流程分析（Process Analysis）是核心工具，不是合約文件或客戶訂購單這類文件本身。",0,null,"做品質保證最常用的方法是：抽查排練流程有沒有問題（品質稽核）、分析整個籌備流程，不是看合約或訂購單這種文件本身。"],["品質稽核的目的","判斷哪個專案流程無效率或無效果、改進流程、降低品質成本（COQ），並非只檢查交付標的正確性——那是控制品質的範疇。",1,null,"品質稽核的目的是找出哪個籌備流程沒效率、幫忙改善它、降低因為品質不好而重做浪費的班費，不是只檢查表演做對了沒（那是控制品質在做的事）。"],["品質成本理論的三位學者","Deming、Juran、Crosby 的觀點常被放在一起考，尤其「85% 品質成本由管理問題造成」是誰的主張。",1,[["Deming","主張持續改善（PDCA），強調管理階層應對品質問題負最大責任。"],["Juran","主張 85% 的品質成本皆由管理問題所造成，提出品質三部曲。"],["Crosby","主張零缺點（Zero Defect）與「第一次就做對」。"]],"三位品質大師的主張不一樣：戴明強調要持續改善，幹部要負最大責任；朱蘭說85%的問題是管理不當造成的；克勞斯比主張「零失誤」、「第一次就做對，不要一直NG重來」。"],["品質保證的產出","組織流程資產更新、請求變更、建議的矯正行動，不含「品質管理計畫」本身（那是規劃階段的產出）。",0,null,"做完品質保證後會產出：更新學校的流程資料、提出變更請求、建議的改善做法，不包含「品質管理計畫」本身（那是規劃階段就寫好的東西）。"]]},{"name":"採購執行","diagram":"<figure><svg viewBox=\"0 0 700 150\" role=\"img\" aria-label=\"採購管理五流程圖，標示本子主題聚焦於執行採購\"><defs><marker id=\"pc-arrow\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0L10,5L0,10z\" fill=\"currentColor\"/></marker></defs><circle cx=\"30\" cy=\"24\" r=\"13\" fill=\"var(--u-color)\"/><text x=\"30\" y=\"29\" class=\"flabel on-solid\">1</text><rect x=\"4\" y=\"42\" width=\"128\" height=\"42\" rx=\"8\" class=\"fbox\"/><text x=\"68\" y=\"68\" class=\"flabel\">規劃採購</text><line x1=\"132\" y1=\"63\" x2=\"154\" y2=\"63\" class=\"fline\" marker-end=\"url(#pc-arrow)\"/><circle cx=\"184\" cy=\"24\" r=\"13\" fill=\"var(--u-color)\"/><text x=\"184\" y=\"29\" class=\"flabel on-solid\">2</text><rect x=\"158\" y=\"42\" width=\"128\" height=\"42\" rx=\"8\" class=\"fbox\"/><text x=\"222\" y=\"68\" class=\"flabel\">邀商</text><line x1=\"286\" y1=\"63\" x2=\"308\" y2=\"63\" class=\"fline\" marker-end=\"url(#pc-arrow)\"/><circle cx=\"376\" cy=\"24\" r=\"13\" fill=\"var(--accent-ring)\"/><text x=\"376\" y=\"29\" class=\"flabel on-solid\">3</text><rect x=\"312\" y=\"42\" width=\"128\" height=\"42\" rx=\"8\" class=\"fbox hi\"/><text x=\"376\" y=\"68\" class=\"flabel\">執行採購</text><line x1=\"440\" y1=\"63\" x2=\"462\" y2=\"63\" class=\"fline\" marker-end=\"url(#pc-arrow)\"/><circle cx=\"530\" cy=\"24\" r=\"13\" fill=\"var(--u-color)\"/><text x=\"530\" y=\"29\" class=\"flabel on-solid\">4</text><rect x=\"466\" y=\"42\" width=\"128\" height=\"42\" rx=\"8\" class=\"fbox\"/><text x=\"530\" y=\"68\" class=\"flabel\">控制採購</text><line x1=\"594\" y1=\"63\" x2=\"616\" y2=\"63\" class=\"fline\" marker-end=\"url(#pc-arrow)\"/><circle cx=\"658\" cy=\"24\" r=\"13\" fill=\"var(--u-color)\"/><text x=\"658\" y=\"29\" class=\"flabel on-solid\">5</text><rect x=\"620\" y=\"42\" width=\"76\" height=\"42\" rx=\"8\" class=\"fbox\"/><text x=\"658\" y=\"62\" class=\"flabel\">結束</text><text x=\"658\" y=\"77\" class=\"flabel\">採購</text><text x=\"376\" y=\"110\" class=\"fcallout\">↑ 本子主題聚焦在「執行採購」這一步</text></svg><figcaption>採購管理是一條線性流程，跟五大流程群組不同，沒有明顯的重疊。紅框標出的「執行採購」是實際去邀標、談判、簽約選出賣方的階段，也是本子主題（採購執行）的內容範圍。</figcaption></figure>","points":[["採購管理五流程","規劃採購管理 → 邀商（Request Seller Response）→ 執行採購（Conduct Procurements）→ 控制採購 → 結束採購，執行大類主要對應中間的「執行採購」。",0,null,"找廠商租道具從頭到尾五步驟：先規劃要租買什麼→請廠商來報價→真正談價錢選定廠商（執行採購）→租借期間持續盯著→結案。這個章節主要在講中間「選定廠商」這一步。"],["執行採購的 ITTO","投入含採購管理計畫書、採購文件、合格賣方清單；工具技術含投標人會議、廣告、採購談判；產出含合約、選定賣方。",1,[["投入：合格賣方清單","已通過初步篩選、符合資格的潛在賣方名單。"],["工具技術：投標人會議","又稱承包商會議、供應商會議，確保各方對採購需求有清楚一致的理解。"],["工具技術：採購談判","與潛在賣方協商合約條款與價格。"],["產出：選定賣方","經過評估後最終選定的合約對象。"]],"選定廠商需要：合格廠商名單、採購計畫書（先備好的東西）；透過開會說明、貼公告、討價還價（用的方法）；最後簽出合約、確定跟誰租借（做出來的結果）。"],["投標人會議的目的","確保所有潛在賣方對本項採購目的（技術要求、合約要求等）都有清楚的共同理解，屬於執行採購的工具技術。",0,null,"開廠商說明會的目的是確保所有可能配合的廠商，對這次要租借的東西都有一樣清楚的理解，避免各自理解不同、報價亂七八糟。"],["評估標準 Evaluation Criteria","用來評比與評分建議書、挑選賣方流程的方法，屬於「請求賣方回應」流程的工具技術。",0,null,"評估標準是拿來幫大家打分數、比較、挑選要跟哪家廠商合作用的方法，是在「請廠商報價」這個階段用的工具。"]]},{"name":"溝通與利害關係人管理","points":[["三種主要溝通方式","書面（Written）、口頭（Verbal）、非口頭（Non-verbal），是溝通管理最基本的三分類，也常考哪一種不屬於正式口頭溝通。",0,[["書面溝通","以文字紀錄呈現，如報告、備忘錄、E-mail。"],["口頭溝通","以語言直接表達，如會議、會談。"],["非口頭溝通","透過肢體語言、語氣等非文字方式傳達訊息。"]],"溝通分三種：書面（寫下來，像通知單、Line文字）、口頭（用講的，像開小組會議）、非口頭（用表情、動作傳達，像皺眉頭表示不同意）。"],["績效報告常用工具技術","變異分析（Variance Analysis）、資訊散布、趨勢分析是核心工具，「績效評估」這種泛稱不算工具技術。",0,null,"看籌備進度報告常用的方法是：比較實際跟原本計畫差多少（變異分析）、把資訊公布給大家看、看趨勢在往哪個方向走，不是空泛地說「表現評估」。"],["管理利害關係人參與的工具","溝通方法、人際關係技巧、管理技巧，不含「專家判斷」（那屬於其他流程的工具）。",0,null,"要管理校方、家長這些人有沒有好好參與，會用溝通方法、人際關係技巧、管理技巧，不會用「請專家來判斷」（那是別的流程在用的工具）。"],["指導與管理專案執行 DMPW","核心概念是資源在此階段投入、實行受指派的活動以產出專案產品或服務；產出含工作績效資訊、交付標的、變更請求。",1,null,"指導與管理專案執行，就是真正把人力班費投入進去、照計畫排練佈置、做出成果；會產出：進度資訊、實際完成的東西、變更請求。"]]},{"name":"人力資源獲得與管理","points":[["獲得專案團隊的主要目的","確保取得完成專案工作所需的人力資源，是「獲得專案團隊 Acquire Project Team」流程的核心目的。",0,null,"「找齊團隊」這個步驟的目的很單純：把辦這場活動需要的人手都找齊。"],["管理專案團隊常用工具技術","觀察與談話、績效評估、衝突管理、人際關係技巧，是追蹤與提升團隊成員績效的核心方法。",0,null,"管理組員常用的方法：平常觀察和聊天、看表現好不好、處理吵架糾紛、運用人際關係技巧——用這些來追蹤、提升每個組員的表現。"],["選擇團隊成員的考量特性","以前經驗、個人特質、個人興趣、可利用時間，是選才時應考量的特性；薪資不是這個流程要考量的重點特性。",0,null,"選組員的時候要考慮：這個人以前有沒有類似經驗、他的個性適不適合、他有沒有興趣、有沒有空——零用錢不是這個階段要考慮的重點。"],["團隊成員私人事務的歸屬","例如醫療保險賠償這類私人問題，通常應由人力資源辦公室（Human Resources Office）負責，而不是 PM 親自處理。",0,null,"組員的私人問題（例如家裡有事、身體不舒服），通常應該交給導師或輔導室去處理，不需要總召自己出面插手。"]]}]},{"name":"專案監視及控制（Monitoring and Controlling）","short":"監視控制","count":60,"key":"c5","subtopics":[{"name":"範疇與品質控制","points":[["確認範疇 vs 控制品質","確認範疇（Validate Scope）著重交付物的「可接受性」，由客戶／贊助者正式驗收；控制品質著重交付物的「正確性」，一般發生在確認範疇之前。",1,[["確認範疇 Validate Scope","驗證交付標的，讓利害關係人正式接受工作成果，著重可接受性。"],["控制品質 Control Quality","監控並記錄執行品質活動的結果，評估績效與建議必要變更，著重正確性。"]],"確認範疇是看「成果校方接不接受」，通常在控制品質之後、由校方正式驗收；控制品質是看「表演本身做得對不對」。"],["確認範疇的四項投入","專案管理計畫、交付標的、需求追溯矩陣、工作績效資料，四項齊全才是完整的投入。",0,null,"要讓校方驗收，需要先準備：活動計畫、要交出的成果、需求對照表、實際完成的進度資料，四樣要齊全。"],["控制品質常用工具技術","流程圖、查檢表、統計抽樣等七大品質工具，不含「獲准之變更申請審查」（那屬於整合變更控制的範疇）。",0,null,"控制品質常用的工具是流程圖、檢核表、抽查這類「七大品質工具」，不包含「審查已經核准的變更申請」（那是整合變更控制的事）。"],["柏拉圖法則（80/20 法則）","80% 問題的產生可歸責於 20% 的缺失原因，常直接考「這個原理稱為下列哪一項」。",1,null,"80/20 法則：籌備出的80%問題，通常都是那20%固定的原因造成的（例如老是同一組拖進度）。"]]},{"name":"時程與成本控制","diagram":"<figure><svg viewBox=\"0 0 720 260\" role=\"img\" aria-label=\"EVM實獲值管理S曲線圖，PV高於AC高於EV代表進度落後且超支\"><text x=\"440\" y=\"14\" class=\"fnote\">範例：截至「資料日期」，進度落後且超支的專案</text><rect x=\"10\" y=\"80\" width=\"150\" height=\"150\" rx=\"10\" fill=\"var(--card)\" stroke=\"var(--hairline)\" stroke-width=\"1\"/><line x1=\"24\" y1=\"106\" x2=\"44\" y2=\"106\" class=\"fline\" stroke=\"var(--u-color)\" stroke-width=\"3\"/><text x=\"50\" y=\"110\" class=\"flabel\" style=\"text-anchor:start\">PV</text><text x=\"24\" y=\"124\" class=\"fsub\" style=\"text-anchor:start\">Planned Value</text><text x=\"24\" y=\"138\" class=\"fsub\" style=\"text-anchor:start\">計畫值</text><line x1=\"24\" y1=\"150\" x2=\"44\" y2=\"150\" class=\"fline fdash\" stroke=\"var(--accent-ring)\" stroke-width=\"3\"/><text x=\"50\" y=\"154\" class=\"flabel\" style=\"text-anchor:start\" fill=\"var(--accent-ring)\">AC</text><text x=\"24\" y=\"168\" class=\"fsub\" style=\"text-anchor:start\">Actual Cost</text><text x=\"24\" y=\"182\" class=\"fsub\" style=\"text-anchor:start\">實際成本</text><line x1=\"24\" y1=\"194\" x2=\"44\" y2=\"194\" class=\"fline\" stroke=\"var(--c3)\" stroke-width=\"3\"/><text x=\"50\" y=\"198\" class=\"flabel\" style=\"text-anchor:start\" fill=\"var(--c3)\">EV</text><text x=\"24\" y=\"212\" class=\"fsub\" style=\"text-anchor:start\">Earned Value</text><text x=\"24\" y=\"226\" class=\"fsub\" style=\"text-anchor:start\">實獲值</text><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"235\" class=\"faxis\"/><line x1=\"185\" y1=\"230\" x2=\"685\" y2=\"230\" class=\"faxis\"/><text x=\"170\" y=\"30\" class=\"ftick\">累積金額</text><text x=\"680\" y=\"248\" class=\"ftick\">時間 →</text><line x1=\"430\" y1=\"26\" x2=\"430\" y2=\"230\" class=\"fline fdash\" stroke=\"var(--ink-muted)\"/><text x=\"430\" y=\"248\" class=\"ftick\">資料日期（現在）</text><path d=\"M190,230 C300,225 350,150 420,120 C500,85 560,60 680,50\" class=\"fline\" stroke=\"var(--u-color)\" stroke-width=\"2.6\" fill=\"none\"/><path d=\"M190,230 C280,227 330,190 380,175 C400,170 415,167 430,165\" class=\"fline\" stroke=\"var(--c3)\" stroke-width=\"2.6\" fill=\"none\"/><path d=\"M190,230 C280,225 340,175 390,150 C405,145 418,142 430,140\" class=\"fline fdash\" stroke=\"var(--accent-ring)\" stroke-width=\"2.6\" fill=\"none\"/><circle cx=\"430\" cy=\"115\" r=\"5\" fill=\"var(--u-color)\"/><circle cx=\"430\" cy=\"140\" r=\"5\" fill=\"var(--accent-ring)\"/><circle cx=\"430\" cy=\"165\" r=\"5\" fill=\"var(--c3)\"/></svg><figcaption>三條線在「資料日期」這一刻的高低順序，就是判讀 SV／CV 的關鍵：EV 低於 PV → 時程落後（SV=EV−PV 為負）；EV 低於 AC → 成本超支（CV=EV−AC 為負）。三線的相對高低會隨專案實際狀況改變，不是固定的。</figcaption></figure>","points":[["控制時程的正確步驟","分析時程以決定是否採行校正行動、決定所要採行的特定校正行動、修正計畫並併入校正行動——不包含「更換專案團隊」這種過度反應。",0,null,"控制進度要做的事：先分析目前進度看要不要調整、決定具體要怎麼調整、把調整方案併入排練表——不包含「直接換掉整組人」這種過激反應。"],["EVM 三大基本量","計畫值 PV（目前為止應完成多少工作）、實獲值 EV（目前多少工作已完成）、實際成本 AC（實際花費多少），是成本控制的計算基礎。",1,[["計畫值 PV","截至目前為止，依計畫應完成的工作價值。"],["實獲值 EV","截至目前為止，實際已完成工作的價值。"],["實際成本 AC","截至目前為止，完成工作實際花費的成本。"]],"檢查籌備進度時看三個數字：原本說好這時候該完成多少（PV）、實際真的完成多少（EV）、已經花了多少班費（AC）。"],["EVM 衍生指標與判讀","成本變異 CV=EV−AC、時程變異 SV=EV−PV、成本績效指標 CPI=EV/AC；CPI>1 代表成本執行績效良好，是這個大類最常出現的計算與判讀題。",1,null,"把這三個數字互相比一比就能看出狀況：花費有沒有超支（EV減AC）、進度有沒有落後（EV減PV）、錢花得值不值（EV除以AC，大於1代表划算）。"],["範疇潛變 Scope Creep","未經正式變更程序而逐漸增加範疇，因應之道最重要的是嚴格執行整合變更控制，而不是事後補救。",0,null,"範疇潛變就是沒經過正式討論、表演內容卻越加越多、越滾越大，最好的預防方法是嚴格照變更流程走，不要等快來不及了才補救。"],["較佳的專案報告週期","傾向較短的報告週期，能更快發現偏差並及早採取校正行動。",0,null,"進度報告的頻率越短越好（例如每天回報一次而不是每週），因為可以更快發現問題、更早做出調整。"]]},{"name":"變更與構型管理","points":[["整合變更控制的內容","規定專案所有變更所應遵循的手續，包括書面申請、追蹤系統以及核准變更的審批級別，屬於整體變更控制過程的一部分。",1,null,"整合變更控制規定的是「臨時想改內容要走的手續」，包括要寫書面申請、要有追蹤紀錄、要有幹部層層核准，不能想改就改。"],["變更控制委員會 CCB","由專案利害關係人組成，專案的任何變更都應透過 CCB 審核，但決議內容仍需與客戶達成共識，不是「不需要與客戶達成共識」。",1,null,"有人臨時想改表演內容？不能自己決定，要交給一個「審核小組」（幾位老師和幹部組成）點頭同意才能改，改完還是要讓校方知道並取得共識，不能瞞著。"],["構型管理 Configuration Management","用於確定專案產品／服務／結果的功能與實體特性符合需求規格的技術，涵蓋規劃、衡量與偵測過程的所有活動。",0,null,"構型管理是用來確保最後的成果，功能和外觀都符合原本說好的規格，涵蓋規劃、測量、檢查的所有活動——確保道具真的長成當初畫的設計圖那樣。"],["實施整合變更控制的投入","專案管理計畫、工作績效報告、變更申請、專家判斷，不含「品質管理計畫」。",0,null,"要審核一個變更，需要先準備：活動計畫、進度報告、變更申請單、有經驗的人判斷，不包含「品質管理計畫」。"]]},{"name":"風險與採購監控","points":[["風險監控貫穿整個生命週期","追蹤已識別的風險、監測殘餘風險、識別新風險、實施風險應對計畫並評估其有效性，這些活動貫穿整個專案生命週期。",0,null,"追蹤已知可能出包的事、留意還沒解決的小狀況、找出新的出包可能、執行應變計畫並檢查有沒有效——這些工作要一直做到活動結束，不是做一次就好。"],["發現未辨識風險的因應","應主動採取額外的風險應對規劃，而不是被動採用繞道規劃（Walk Around Plans）當臨時措施。",1,null,"如果臨時發現一個當初沒想到的狀況（例如場地突然要收費），應該主動想好正式的應對方式，而不是隨便亂繞過去應付一下。"],["控制採購的重要依據","合約（Contract）是控制採購中保障買賣雙方權益最重要的依據，尤其是有多個供應商來源的大型專案。",0,null,"控制跟廠商的合作最重要的依據就是合約，尤其同時跟好幾家廠商租借道具器材時，更需要靠合約來保障雙方權益。"],["供應商合作不佳的改善做法","應進行採購稽核（Procurement Audit），並把經驗納入未來供應商評選、避免重蹈覆轍。",0,null,"如果跟某家廠商合作不順利（例如常常遲到、東西壞掉），應該檢討這次合作經驗，記下來，未來挑廠商時參考，避免重蹈覆轍。"]]},{"name":"溝通與利害關係人控制","points":[["控制利害關係人參與的工具","資訊管理系統、專家判斷、會議是核心工具技術，「合約」本身不算是這個流程的工具。",0,null,"要檢查校方、家長這些人有沒有好好參與，用的方法是資訊公告、請有經驗的人判斷、開會討論，「合約」本身不算是這裡用的工具。"],["利害關係人參與效能降低時","當利害關係人參與活動的效能與效率逐漸降低、進度受影響時，應特別著重「管理利害關係人參與」子流程。",0,null,"如果發現校方、家長越來越不關心這場活動、進度也跟著受影響，就要特別加強跟他們的溝通聯繫。"],["績效報告差異分析重點","與專案基準比較時，差異分析著重於成本差異及時程差異，而不是泛指的問題分析。",0,null,"看進度報告的差異分析，主要看的是「班費差多少」跟「進度差多少天」，不是籠統地說「哪裡怪怪的」。"],["變更申請可能包含的依據","工作績效資訊、專案管理計畫書、至今所有的會議記錄，都可能是提出變更申請時參考的依據。",0,null,"提出變更申請時，可以參考的依據包括：目前的進度資訊、原本的活動計畫書、之前所有的會議紀錄。"]]}]},{"name":"專案結束（Closing）","short":"結束","count":20,"key":"c6","subtopics":[{"name":"結案作業與管理結束","points":[["結案時應做的事","依專案結案作業檢查清單查核、立即支付所有採購債務及帳單、設備材料規劃移轉、完成結案報告——不含「工作重分派」這種執行期活動。",1,null,"活動結束要做的事：照檢查清單一項項核對、馬上把該付給廠商的錢結清、把租借的設備歸還處理好、寫完成果報告——不包含「重新分派工作」這種還在忙的動作。"],["管理結束程序的內容","收集專案記錄、收集吸取的教訓（Lessons Learned）、分析專案成敗，不含「建置工作分解結構」這種規劃期活動。",0,null,"收尾流程包括：整理這次活動的所有紀錄、收集這次學到的教訓、檢討這次辦得成不成功，不包含「拆解工作清單」這種一開始規劃階段才會做的事。"],["文件歸檔編碼方式","「依作業性質編碼」是常見的一種編碼方式，如「專案編號－大綱編號－細目序號－版本」。",0,null,"常見的檔案歸檔方式是「照活動性質分類編號」，例如「活動編號-類別編號-細項序號-第幾版」這種格式，方便日後查找。"],["結束專案或階段的投入","專案管理計畫、企業環境因素、組織流程資產、已驗證過的交付標的，四項齊全才是完整投入。",0,null,"要結束一場活動或一個階段，需要先準備：活動計畫、學校的大環境條件、學校原有的規定範本、已經驗收過的成果，四樣要齊全。"]]},{"name":"結束採購","points":[["結束採購的產出","組織流程資產更新、正式接受（Formal Acceptance）——以書面方式正式接受專案或採購的結果。",0,null,"結束跟廠商的合作後會產出：更新學校的檔案資料、正式驗收（用書面確認正式收下這次租借/購買的成果）。"],["提早終止合約的可能原因","雙方達成協議、買方或賣方違反合約內容、未預期的天災等，不包含「PM 不喜歡合約的買賣項目」這種主觀理由。",0,null,"跟廠商的合約可能提早結束的原因：雙方談好了、有一方違約、遇到天災這種無法預期的事——不包含「總召單純不喜歡這家廠商」這種主觀理由。"],["避免供應商合作不佳重演","未來專案需要把供應商評選記錄、必要時列入黑名單，並落實採購稽核，納入日後的作業規範。",0,null,"為了避免下次再找到不好配合的廠商，要把這次的評選紀錄留下來，必要時列入黑名單，並確實檢討這次合作，變成以後找廠商的參考規範。"]]},{"name":"專案成功與結案評估","points":[["衡量專案真正成功的關鍵","顧客的滿意度是比「如期、如質、如預算完成」更關鍵的最終判準，常考「哪一項要素最為關鍵」。",1,null,"判斷這場活動是不是真的成功，最關鍵的其實是「校方和觀眾滿不滿意」，不只是看有沒有準時演出、品質好不好、有沒有在班費預算內完成。"],["結案報告與經驗學習","建立經驗學習（Lessons Learned）及紀錄文件、與贊助者顧客團隊共同檢討專案程序與成果，是結案報告的重要內容。",0,null,"結案報告的重要內容包括：把這次學到的教訓寫下來記錄好、跟校方和觀眾代表一起檢討整個籌備過程和最後成果。"],["結案會議中的不滿處理","若利害關係人在結案會議中有不滿，PM 應優先了解其對交付標的正確性、驗收爭議方面的疑慮。",0,null,"如果檢討會議上有人不滿意，總召應該優先去了解，是不是對最後成果的內容、或驗收過程有意見。"]]},{"name":"結案爭議情境處理","points":[["客戶要求額外功能模組","應開始合約收尾，並就額外功能模組另外簽訂「新合約」，而不是片面追加預算或直接拒絕客戶，避免範疇鍍金問題。",1,null,"如果內容已經做完了，校方又臨時想加額外的表演項目，正確做法是走收尾流程、另外談一份新的協議，而不是直接拒絕、也不是免費幫他加。"],["公共工程驗收爭議","驗收人員與接收人員反對結案，通常反映雙方欠缺溝通，或專案團隊未事先與各方建立專案結案共識。",0,null,"如果驗收的人跟接收的人對「這樣算不算完成」意見不合，通常代表雙方之前溝通不夠，沒有先講好「什麼樣才算做完」的共識。"],["結案後內部會議的參與者","通常以內部人員與客戶代表為主，技術廠商代表這類外部人員較不可能參加內部結案檢討會議。",0,null,"活動結束後的內部檢討會議，通常是自己班上同學加上校方代表參加，外部租借的廠商代表比較不會被邀請進來。"]]}]}];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

function renderTerms(terms) {
  if (!terms) return "";
  return '<div class="terms">' + terms.map(function (t) {
    return '<div class="term"><b>' + escapeHtml(t[0]) + '</b><span>' + escapeHtml(t[1]) + '</span></div>';
  }).join("") + '</div>';
}

function renderPoint(p) {
  var label = p[0], desc = p[1], hot = p[2], terms = p[3];
  var cardClasses = "point-card" + (hot ? " hot" : "");
  var html = '<div class="' + cardClasses + '" data-search="' +
    escapeHtml((label + " " + desc).toLowerCase()) + '">';
  html += '<div class="point-head"><div class="point-label">' + escapeHtml(label) + '</div>';
  if (hot) html += '<div class="hot-badge">★ 常考混淆點</div>';
  html += '</div>';
  html += '<p class="point-desc">' + escapeHtml(desc) + '</p>';
  html += renderTerms(terms);
  if (CONFUSABLES[label]) {
    html += '<div class="confusable-box"><div class="confusable-title">⚠️ 容易搞混</div>' +
      '<div class="confusable-body">' + CONFUSABLES[label] + '</div></div>';
  }
  html += '</div>';
  return html;
}

function renderSubtopic(sub) {
  var html = '<div class="sub-block">';
  html += '<h3 class="sub-title">' + escapeHtml(sub.name) + '</h3>';
  if (sub.diagram && sub.name !== "五大流程群組") {
    html += '<div class="diagram-wrap"><div class="diagram-lead">📊 先看圖：' + escapeHtml(sub.name) + '</div>' +
      '<div class="diagram">' + sub.diagram + '</div></div>';
  }
  html += '<div class="points">' + (sub.points || []).map(renderPoint).join("") + '</div>';
  html += '</div>';
  return html;
}

function renderCategory(cat, i) {
  var totalPoints = cat.subtopics.reduce(function (n, s) { return n + (s.points ? s.points.length : 0); }, 0);
  var html = '<details class="cat-block" id="cat-' + i + '"' +
    (i === 0 ? " open" : "") + ' name="cat-accordion" style="--u-color:var(--' + cat.key + ');--u-tint:var(--' + cat.key + '-tint);--u-text:var(--' + cat.key + '-strong)">';
  html += '<summary class="cat-summary"><span class="num-badge">' + (i + 1) + '</span>' +
    '<h2>' + escapeHtml(cat.name) + '</h2>' +
    '<span class="cat-count">' + cat.subtopics.length + ' 子主題・' + totalPoints + ' 知識點</span>' +
    '<span class="chev">▸</span></summary>';
  html += '<div class="cat-body">' + cat.subtopics.map(renderSubtopic).join("") + '</div>';
  html += '</details>';
  return html;
}

function renderEntryRow() {
  var html = DATA.map(function (cat, i) {
    return '<a class="entry-btn" href="#cat-' + i + '" data-idx="' + i + '" ' +
      'style="--entry-text:var(--' + cat.key + '-strong);--entry-tint:var(--' + cat.key + '-tint)">' +
      '<span class="num">' + (i + 1) + '</span><span>' + escapeHtml(cat.name) + '</span></a>';
  }).join("");
  document.getElementById("entry-row").innerHTML = html;
}

function openCategoryFromHash(idx) {
  var el = document.getElementById("cat-" + idx);
  if (!el) return;
  el.setAttribute("open", "");
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

function refreshVisibility() {
  var q = document.getElementById("search-input").value.trim().toLowerCase();
  var hotOnly = document.getElementById("hot-checkbox").checked;
  var matchCount = 0;
  var anyVisible = false;

  document.querySelectorAll(".point-card").forEach(function (el) {
    var textMatch = !q || el.getAttribute("data-search").indexOf(q) !== -1;
    var hotMatch = !hotOnly || el.classList.contains("hot");
    var visible = textMatch && hotMatch;
    el.style.display = visible ? "" : "none";
    if (visible) { matchCount++; anyVisible = true; }
  });

  document.querySelectorAll(".sub-block").forEach(function (sub) {
    var hasVisible = Array.prototype.some.call(sub.querySelectorAll(".point-card"), function (c) {
      return c.style.display !== "none";
    });
    sub.classList.toggle("is-hidden", !hasVisible);
  });

  document.querySelectorAll(".cat-block").forEach(function (cat) {
    var hasVisible = Array.prototype.some.call(cat.querySelectorAll(".sub-block"), function (s) {
      return !s.classList.contains("is-hidden");
    });
    cat.classList.toggle("is-hidden", !hasVisible);
    if (q && hasVisible) cat.setAttribute("open", "");
  });

  document.getElementById("no-results").style.display = anyVisible ? "none" : "block";
  document.getElementById("search-count").textContent = q ? ("找到 " + matchCount + " 個") : "";
}

function findDiagram(name) {
  for (var i = 0; i < DATA.length; i++) {
    var subs = DATA[i].subtopics;
    for (var j = 0; j < subs.length; j++) {
      if (subs[j].name === name) return subs[j].diagram;
    }
  }
  return null;
}

function main() {
  document.getElementById("sections").innerHTML = DATA.map(renderCategory).join("");
  renderEntryRow();

  var lifecycleDiagram = findDiagram("五大流程群組");
  if (lifecycleDiagram) document.getElementById("hero-diagram").innerHTML = lifecycleDiagram;

  var totalQuestions = DATA.reduce(function (n, c) { return n + c.count; }, 0);
  document.getElementById("page-footer").innerHTML =
    "資料來源：" + escapeHtml(SOURCE_NOTE) + "（" + escapeHtml(COURSE_CODE) + "）題目解析內容整理，共 " + totalQuestions + " 題。" +
    "知識點說明依題庫原文整理，易混淆重點為 AI 輔助整理歸納，正式作答仍以題庫原文用詞為準。";

  var searchWrap = document.querySelector(".search-wrap");
  var countEl = document.createElement("span");
  countEl.id = "search-count";
  searchWrap.appendChild(countEl);

  document.getElementById("search-input").addEventListener("input", refreshVisibility);
  document.getElementById("hot-checkbox").addEventListener("change", function () {
    document.body.classList.toggle("hot-only", this.checked);
    document.getElementById("hot-toggle").classList.toggle("active", this.checked);
    refreshVisibility();
  });

  document.querySelectorAll(".entry-btn").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      openCategoryFromHash(btn.getAttribute("data-idx"));
      if (window.innerWidth <= 640) document.getElementById("cat-nav").classList.add("collapsed");
    });
  });

  var catNav = document.getElementById("cat-nav");
  if (window.innerWidth <= 900) catNav.classList.add("collapsed");
  document.getElementById("cat-nav-toggle").addEventListener("click", function () {
    catNav.classList.toggle("collapsed");
  });
}

main();
</script>

</html>
